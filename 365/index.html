<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>

    <!-- SEO: canonical wskazuje właściwy adres -->
    <link rel="canonical" href="https://homodigital.io/365/en.html" />

    <!-- Robots: nie indeksuj tej strony -->
    <meta name="robots" content="noindex, follow" />

    <!-- JS: redirect based on browser locale -->
    <script>
      var lang = (
        navigator.language ||
        navigator.userLanguage ||
        'en'
      ).toLowerCase();
      var url = lang.startsWith('pl')
        ? 'https://homodigital.io/365/pl.html'
        : 'https://homodigital.io/365/en.html';
      window.location.replace(url);
    </script>

    <!-- Fallback for no-JS: default to English -->
    <meta
      http-equiv="refresh"
      content="1; url=https://homodigital.io/365/en.html"
    />
  </head>
  <body>
    <p>
      Redirecting…
      <a href="https://homodigital.io/365/en.html">English</a> |
      <a href="https://homodigital.io/365/pl.html">Polski</a>
    </p>
  </body>
</html>
