      /* --- */
      .send-btn {

        background: #2b4a6f;

      }

      }
      .rez-overlay.open {
        display: flex;
      }
      .rez-overlay .rez-overlay-header {
        padding: 0.65rem 1.25rem;

        font-weight: 600;
        color: var(--gold);
      }

        padding: 0.3rem 0.7rem;
        background: transparent;
        color: var(--text2);
        border: 1px solid #444;
        border-radius: 4px;
        font-size: 0.78rem;
        cursor: pointer;
        font-family: var(--f);
      }
      .rez-overlay .rez-display {
        padding: 1.5rem 1.25rem 1rem;
      }
      .rez-overlay .rez-big {

      }

      }

        margin-left: -1.25rem;

  <body>
    <div id="app">
      <div class="header">
        <span class="header-title">Znaj Siebie</span>
        <div class="header-right">
          <button class="rez-badge" id="rezBadge" onclick="openRezPanel()">
            <div class="rez-dot" id="rezBadgeDot"></div>
            <span class="rez-badge-num" id="rezBadgeNum">0.30</span>
          </button>
          <button class="lang-btn" id="langBtn" onclick="toggleLang()">
            EN
          </button>
        </div>
      </div>
      <div class="rez-overlay" id="rezOverlay">
        <div class="rez-overlay-header">
          <span class="rez-overlay-title" id="rezOverlayTitle"
            >Twój rezonans</span
          >
          <button
            class="close-btn"
            id="closeOverlayBtn"
            onclick="closeRezPanel()"
          >
            Zamknij
          </button>
        </div>
        <div class="rez-display" id="rezDisplayMobile"></div>
        <div class="timeline-scroll" id="timelineScrollMobile"></div>
      </div>
      <div class="main">
        <div class="left">
          <div class="topics-view" id="topicsView"></div>
          <div
            id="chatView"
            style="
              display: none;
              flex: 1;
              flex-direction: column;
              min-height: 0;
            "
          >
            <div class="chat-header">
              <button class="back-btn" id="backBtn" onclick="goBack()">
                ← Wróć do tematyk
              </button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-bar">
              <textarea
                class="chat-textarea"
                id="chatInput"
                rows="1"
                placeholder="Twoja odpowiedź..."
              ></textarea>
              <button class="send-btn" id="sendBtn" disabled onclick="doSend()">
                Wyślij
              </button>
            </div>
          </div>
        </div>
        <div class="right" id="rightPanel">
          <div class="rez-display" id="rezDisplayDesktop"></div>
          <div class="timeline-scroll" id="timelineScrollDesktop">
            <div class="timeline-sticky" id="tlStickyDesktop">Timeline</div>
            <div class="tl-entries" id="tlEntriesDesktop"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const API_URL = 'https://homodigital-api.olbik80.workers.dev/';
      const TEXTS = {
        pl: {
          title: 'Znaj Siebie',
          topics: 'Tematyki z odcinka',
          free: 'Własny temat',
          freePlaceholder: 'Napisz o czym chcesz porozmawiać...',
          chatPlaceholder: 'Twoja odpowiedź...',
          send: 'Wyślij',
          thinking: 'Myślę...',
          rezPanel: 'Twój rezonans',
          timeline: 'Timeline',
          noEntries: 'Zacznij rozmowę — tu pojawi się twoja historia',
          closed: '✓',
          back: '← Wróć do tematyk',
          langSwitch: 'EN',
          continuing: '● kontynuacja',
          closePanel: 'Zamknij',
        },
        en: {
          title: 'Know Yourself',
          topics: 'Episode Topics',
          free: 'Free Topic',
          freePlaceholder: 'Write what you want to talk about...',
          chatPlaceholder: 'Your response...',
          send: 'Send',
          thinking: 'Thinking...',
          rezPanel: 'Your Resonance',
          timeline: 'Timeline',
          noEntries: 'Start a conversation — your history will appear here',
          closed: '✓',
          back: '← Back to topics',
          langSwitch: 'PL',
          continuing: '● continuing',
          closePanel: 'Close',
        },
      };
      let tesseractBase = '';
      const ZNAJ_SIEBIE_PL = `\n\n=== ZNAJ SIEBIE — KONTEKST PROGRAMU ===\n\nDziałasz jako partner rozmowy w programie "Znaj Siebie".\n\nZASADY PROGRAMU:\n- Jesteś ciepły, ale uczciwy. Partner, nie terapeuta.\n- NIE STAWIAJ DIAGNOZ. Jeśli widzisz coś niepokojącego, delikatnie zasugeruj rozmowę z zaufaną osobą.\n- Odpowiadaj krótko (2-4 zdania), nie pisz esejów.\n- Gdy temat jest wyczerpany (widz powiedział wszystko, rozmowa się kręci w kółko, widz powtarza te same punkty) — ustaw topic_closed na true i w response napisz krótkie, ciepłe podsumowanie tego co widz odkrył o sobie.\n\nODPOWIADAJ WYŁĄCZNIE W FORMACIE JSON (bez markdown, bez backticks):\n{"response":"twoja odpowiedź","rez":0.5,"rez_reason":"krótki powód zmiany rez","surprise":null,"topic_closed":false}\n\nrez: liczba 0.0-0.95 (NIGDY nie dawaj 1.0) opisująca głębokość samopoznania widza.\n  0.2-0.4 = początek, powierzchowna wymiana\n  0.5-0.6 = widz zaczyna się otwierać\n  0.7-0.8 = prawdziwa szczerość, głębokie samopoznanie\n  0.85-0.95 = wyjątkowy moment autentyczności\n  rez zmienia się z granulacją 0.01 — używaj pełnego zakresu (np. 0.33, 0.47, 0.62, 0.71, 0.88). NIE zaokrąglaj do 0.05. Każda odpowiedź widza to unikalna głębokość — rez powinien to odzwierciedlać precyzyjnie.\n\nsurprise: null jeśli brak, albo krótki opis jeśli widz powiedział coś naprawdę nieoczekiwanego\n\nZaczynaj od rez ~0.3.`;
      const ZNAJ_SIEBIE_EN = `\n\n=== KNOW YOURSELF — SHOW CONTEXT ===\n\nYou are a conversation partner in the "Know Yourself" show.\n\nSHOW RULES:\n- Be warm but honest. Partner, not therapist.\n- DO NOT DIAGNOSE. If you see something concerning, gently suggest talking to a trusted person.\n- Keep responses short (2-4 sentences), no essays.\n- When topic is exhausted (viewer said everything, conversation loops, same points repeated) — set topic_closed to true and write a brief, warm summary of what the viewer discovered about themselves.\n\nRESPOND ONLY IN JSON FORMAT (no markdown, no backticks):\n{"response":"your response","rez":0.5,"rez_reason":"short reason for rez level","surprise":null,"topic_closed":false}\n\nrez: number 0.0-0.95 (NEVER give 1.0) describing depth of self-knowledge.\n  0.2-0.4 = beginning, surface exchange\n  0.5-0.6 = viewer starting to open up\n  0.7-0.8 = real honesty, deep self-knowledge\n  0.85-0.95 = exceptional moment of authenticity\n  rez changes with 0.01 granularity — use the full range (e.g. 0.33, 0.47, 0.62, 0.71, 0.88). DO NOT round to 0.05. Every viewer response has unique depth — rez should reflect that precisely.\n\nsurprise: null if none, or short description if viewer said something truly unexpected\n\nStart from rez ~0.3.`;
      let lang = 'pl',
        view = 'topics',
        activeTopic = null,
        convos = {},
        loading = false,
        rez = 0.3,
        entries = [],
        closedTopics = new Set(),
        openEpisodes = new Set(['ep1']),
        episodesData = { pl: [], en: [] };
      function t() {
        return TEXTS[lang];
      }
      function sys() {
        return (
          tesseractBase + (lang === 'pl' ? ZNAJ_SIEBIE_PL : ZNAJ_SIEBIE_EN)
        );
      }
      function ts() {
        return new Date().toISOString();
      }
      function formatTs(isoStr) {
        const d = new Date(isoStr),
          now = new Date(),
          time = d.toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit',
          }),
          sameDay =
            d.getDate() === now.getDate() &&
            d.getMonth() === now.getMonth() &&
            d.getFullYear() === now.getFullYear();
        if (sameDay) return time;
        const dd = String(d.getDate()).padStart(2, '0'),
          mm = String(d.getMonth() + 1).padStart(2, '0');
        if (d.getFullYear() === now.getFullYear())
          return dd + '/' + mm + ' ' + time;
        return dd + '/' + mm + '/' + d.getFullYear() + ' ' + time;
      }
      function rc(r) {
        return r >= 0.8
          ? '#3db86a'
          : r >= 0.6
            ? '#5a9e5a'
            : r >= 0.4
              ? '#b8a83d'
              : r >= 0.2
                ? '#b8783d'
                : '#8e4444';
      }
      function rl(r) {
        if (lang === 'pl')
          return r >= 0.85
            ? 'Głęboki rezonans'
            : r >= 0.7
              ? 'Otwarcie'
              : r >= 0.5
                ? 'Rozmowa'
                : r >= 0.3
                  ? 'Początek'
                  : 'Transakcja';
        return r >= 0.85
          ? 'Deep resonance'
          : r >= 0.7
            ? 'Opening up'
            : r >= 0.5
              ? 'Conversation'
              : r >= 0.3
                ? 'Starting'
                : 'Transaction';
      }
      function parseAI(raw) {
        try {
          return JSON.parse(
            raw
              .replace(/```json\s*/g, '')
              .replace(/```\s*/g, '')
              .trim(),
          );
        } catch (e) {
          return {
            response: raw,
            rez,
            rez_reason: '',
            surprise: null,
            topic_closed: false,
          };
        }
      }
      async function callAPI(messages) {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages, system: sys(), max_tokens: 500 }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        return data.text;
      }
      function handleParsed(parsed, topicId, aiId) {
        rez = Math.min(parsed.rez || rez, 0.95);
        const time = ts();
        entries.push({
          type: 'rez',
          rez,
          reason: parsed.rez_reason || '',
          time,
          msgId: aiId,
          topicId,
        });
        if (parsed.surprise)
          entries.push({
            type: 'surprise',
            text: parsed.surprise,
            time,
            msgId: aiId,
            topicId,
          });
        if (parsed.topic_closed) closedTopics.add(topicId);
      }
      function render() {
        document.querySelector('.header-title').textContent = t().title;
        document.getElementById('langBtn').textContent = t().langSwitch;
        document.getElementById('backBtn').textContent = t().back;
        document.getElementById('rezOverlayTitle').textContent = t().rezPanel;
        document.getElementById('closeOverlayBtn').textContent = t().closePanel;
        document.getElementById('sendBtn').textContent = t().send;
        const badge = document.getElementById('rezBadge');
        badge.style.background = rc(rez) + '22';
        badge.style.border = '1px solid ' + rc(rez) + '44';
        document.getElementById('rezBadgeDot').style.background = rc(rez);
        document.getElementById('rezBadgeNum').style.color = rc(rez);
        document.getElementById('rezBadgeNum').textContent = rez.toFixed(2);
        renderRezDisplay('rezDisplayDesktop');
        renderRezDisplay('rezDisplayMobile');
        renderTimeline('tlEntriesDesktop', 'tlStickyDesktop');
        renderTimelineMobile();
        if (view === 'topics') {
          document.getElementById('topicsView').style.display = '';
          document.getElementById('chatView').style.display = 'none';
          renderTopics();
        } else {
          document.getElementById('topicsView').style.display = 'none';
          document.getElementById('chatView').style.display = 'flex';
          renderChat();
        }
      }
      function renderRezDisplay(id) {
        const el = document.getElementById(id);
        el.innerHTML =
          '<div class="rez-section-label" style="margin-bottom:0.5rem">' +
          t().rezPanel +
          '</div><div class="rez-big" style="color:' +
          rc(rez) +
          '">' +
          rez.toFixed(2) +
          '</div><div class="rez-label-text" style="color:' +
          rc(rez) +
          '">' +
          rl(rez) +
          '</div><div class="rez-bar-track"><div class="rez-bar-fill" style="width:' +
          Math.min(rez / 0.95, 1) * 100 +
          '%;background:' +
          rc(rez) +
          '"></div></div>';
      }
      function renderTimeline(entriesId, stickyId) {
        const sEl = document.getElementById(stickyId);
        if (sEl) sEl.textContent = t().timeline;
        const el = document.getElementById(entriesId);
        if (!el) return;
        if (entries.length === 0) {
          el.innerHTML = '<div class="tl-empty">' + t().noEntries + '</div>';
          return;
        }
        el.innerHTML = entries
          .map(function (e) {
            const isS = e.type === 'surprise';
            return (
              '<div class="tl-entry ' +
              (isS ? 'surprise-entry' : 'rez-entry') +
              '" style="border-left-color:' +
              (isS ? 'var(--surprise-border)' : rc(e.rez || 0)) +
              '" onclick="scrollToMsg(' +
              e.msgId +
              ",'" +
              e.topicId +
              '\')"><div class="tl-top"><span class="' +
              (isS ? 'tl-surprise-label' : 'tl-rez-num') +
              '" style="' +
              (isS ? '' : 'color:' + rc(e.rez)) +
              '">' +
              (isS ? '✦ zaskoczenie' : (e.rez || 0).toFixed(2)) +
              '</span><span class="tl-time">' +
              formatTs(e.time) +
              '</span></div><div class="tl-text">' +
              (isS ? e.text : e.reason) +
              '</div></div>'
            );
          })
          .join('');
      }
      function renderTimelineMobile() {
        var container = document.getElementById('timelineScrollMobile');
        container.innerHTML =
          '<div class="timeline-sticky" style="background:var(--bg)">' +
          t().timeline +
          '</div><div class="tl-entries" id="tlEntriesMobile"></div>';
        renderTimeline('tlEntriesMobile', null);
      }
      function renderTopics() {
        const tv = document.getElementById('topicsView');
        let html = '';
        episodesData[lang].forEach(function (ep) {
          const isOpen = openEpisodes.has(ep.id);
          html +=
            '<div style="margin-bottom:1rem"><button class="ep-toggle" onclick="toggleEp(\'' +
            ep.id +
            '\')"><span class="ep-arrow ' +
            (isOpen ? 'open' : '') +
            '">▶</span>' +
            ep.label +
            '</button>';
          if (isOpen) {
            html += '<div class="ep-topics">';
            ep.topics.forEach(function (tp) {
              const isClosed = closedTopics.has(tp.id),
                hasConvo = convos[tp.id] && convos[tp.id].length > 0;
              html +=
                '<button class="topic-btn ' +
                (isClosed ? 'closed' : '') +
                '" onclick="openTopic(\'' +
                tp.id +
                '\')">' +
                (isClosed
                  ? '<span class="check">' + t().closed + '</span>'
                  : '') +
                '<span style="flex:1">' +
                tp.label +
                '</span>' +
                (hasConvo && !isClosed
                  ? '<span class="cont">' + t().continuing + '</span>'
                  : '') +
                '</button>';
            });
            html += '</div>';
          }
          html += '</div>';
        });
        html +=
          '<div class="free-section"><div class="free-label">' +
          t().free +
          '</div><input class="free-input" id="freeInput" placeholder="' +
          t().freePlaceholder +
          "\" onkeydown=\"if(event.key==='Enter'&&this.value.trim()){startFree(this.value);this.value='';}\" /></div>";
        tv.innerHTML = html;
      }
      function renderChat() {
        const msgs = convos[activeTopic] || [],
          cm = document.getElementById('chatMessages'),
          topicIsClosed = closedTopics.has(activeTopic);
        let html = msgs
          .map(function (m) {
            return (
              '<div class="msg ' +
              (m.role === 'user' ? 'user' : 'ai') +
              '" id="msg-' +
              m.id +
              '"><div class="msg-bubble">' +
              escHtml(m.text) +
              '</div></div>'
            );
          })
          .join('');
        if (loading)
          html += '<div class="msg-thinking">' + t().thinking + '</div>';
        if (topicIsClosed && !loading) {
          const closeMsg =
            lang === 'pl'
              ? 'Temat zamknięty. Wróć do tematyk, żeby wybrać kolejny.'
              : 'Topic closed. Go back to topics to pick another one.';
          html += '<div class="topic-closed-msg">' + closeMsg + '</div>';
        }
        cm.innerHTML = html;
        requestAnimationFrame(function () {
          cm.scrollTop = cm.scrollHeight;
        });
        const ta = document.getElementById('chatInput'),
          sb = document.getElementById('sendBtn');
        sb.textContent = t().send;
        sb.disabled = loading || !ta.value.trim() || topicIsClosed;
        if (topicIsClosed) {
          ta.disabled = true;
          ta.placeholder = lang === 'pl' ? 'Temat zamknięty' : 'Topic closed';
        } else {
          ta.disabled = false;
          ta.placeholder = t().chatPlaceholder;
        }
      }
      function escHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }
      function toggleLang() {
        lang = lang === 'pl' ? 'en' : 'pl';
        render();
        saveState();
      }
      function toggleEp(id) {
        openEpisodes.has(id) ? openEpisodes.delete(id) : openEpisodes.add(id);
        render();
      }
      function goBack() {
        view = 'topics';
        activeTopic = null;
        render();
      }
      function openRezPanel() {
        document.getElementById('rezOverlay').classList.add('open');
      }
      function closeRezPanel() {
        document.getElementById('rezOverlay').classList.remove('open');
      }
      function findTopic(topicId) {
        for (const ep of episodesData[lang]) {
          const tp = ep.topics.find(function (x) {
            return x.id === topicId;
          });
          if (tp) return tp;
        }
        return null;
      }
      async function openTopic(topicId) {
        activeTopic = topicId;
        view = 'chat';
        render();
        if (convos[topicId] && convos[topicId].length) return;
        const tp = findTopic(topicId);
        if (!tp) return;
        loading = true;
        render();
        try {
          const prompt =
            lang === 'pl'
              ? 'Tematyka rozmowy: "' +
                tp.opener +
                '". Zacznij rozmowę — przywitaj się krótko i zadaj pierwsze pytanie widzowi.'
              : 'Conversation topic: "' +
                tp.opener +
                '". Start the conversation — greet briefly and ask the viewer your first question.';
          const raw = await callAPI([{ role: 'user', content: prompt }]);
          const parsed = parseAI(raw);
          const aId = Date.now();
          convos[topicId] = [
            { role: 'assistant', text: parsed.response, raw, id: aId },
          ];
          handleParsed(parsed, topicId, aId);
        } catch (e) {
          convos[topicId] = [
            {
              role: 'assistant',
              text: 'Cześć! Opowiedz mi...',
              id: Date.now(),
            },
          ];
        }
        loading = false;
        render();
        saveState();
      }
      async function startFree(text) {
        const freeId = 'free_' + Date.now();
        activeTopic = freeId;
        view = 'chat';
        loading = true;
        render();
        try {
          const raw = await callAPI([{ role: 'user', content: text }]);
          const parsed = parseAI(raw);
          const uId = Date.now(),
            aId = uId + 1;
          convos[freeId] = [
            { role: 'user', text, id: uId },
            { role: 'assistant', text: parsed.response, raw, id: aId },
          ];
          handleParsed(parsed, freeId, aId);
        } catch (e) {
          convos[freeId] = [
            { role: 'user', text, id: Date.now() },
            { role: 'assistant', text: 'Błąd...', id: Date.now() + 1 },
          ];
        }
        loading = false;
        render();
        saveState();
      }
      async function doSend() {
        const ta = document.getElementById('chatInput'),
          text = ta.value.trim();
        if (!text || !activeTopic) return;
        const uId = Date.now();
        if (!convos[activeTopic]) convos[activeTopic] = [];
        convos[activeTopic].push({ role: 'user', text, id: uId });
        ta.value = '';
        ta.style.height = 'auto';
        loading = true;
        render();
        try {
          const history = convos[activeTopic].map(function (m) {
            return {
              role: m.role === 'user' ? 'user' : 'assistant',
              content: m.role === 'user' ? m.text : m.raw || m.text,
            };
          });
          const raw = await callAPI(history);
          const parsed = parseAI(raw);
          const aId = Date.now();
          convos[activeTopic].push({
            role: 'assistant',
            text: parsed.response,
            raw,
            id: aId,
          });
          handleParsed(parsed, activeTopic, aId);
        } catch (e) {
          convos[activeTopic].push({
            role: 'assistant',
            text: 'Błąd połączenia.',
            id: Date.now(),
          });
        }
        loading = false;
        render();
        saveState();
      }
      function scrollToMsg(msgId, topicId) {
        closeRezPanel();
        if (topicId && topicId !== activeTopic) {
          activeTopic = topicId;
          view = 'chat';
          render();
        }
        setTimeout(function () {
          const el = document.getElementById('msg-' + msgId);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 200);
      }
      document
        .getElementById('chatInput')
        .addEventListener('input', function () {
          this.style.height = 'auto';
          this.style.height = Math.min(this.scrollHeight, 120) + 'px';
          document.getElementById('sendBtn').disabled =
            loading || !this.value.trim();
        });
      document
        .getElementById('chatInput')
        .addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey && !loading) {
            e.preventDefault();
            doSend();
          }
        });
      function saveState() {
        try {
          localStorage.setItem('zs_convos', JSON.stringify(convos));
          localStorage.setItem('zs_entries', JSON.stringify(entries));
          localStorage.setItem('zs_rez', JSON.stringify(rez));
          localStorage.setItem('zs_closed', JSON.stringify([...closedTopics]));
          localStorage.setItem('zs_lang', lang);
        } catch (e) {}
      }
      function loadState() {
        try {
          const c = localStorage.getItem('zs_convos');
          if (c) convos = JSON.parse(c);
          const e = localStorage.getItem('zs_entries');
          if (e) entries = JSON.parse(e);
          const r = localStorage.getItem('zs_rez');
          if (r) rez = JSON.parse(r);
          const cl = localStorage.getItem('zs_closed');
          if (cl) closedTopics = new Set(JSON.parse(cl));
          const l = localStorage.getItem('zs_lang');
          if (l) lang = l;
        } catch (e) {}
      }
      async function init() {
        loadState();
        try {
          const [epRes, tpRes] = await Promise.all([
            fetch('episodes.json'),
            fetch('../tesseract.txt'),
          ]);
          episodesData = await epRes.json();
          tesseractBase = await tpRes.text();
        } catch (e) {
          console.error('Failed to load config:', e);
        }
        render();
      }
      init();
    </script>
  </body>
</html>
