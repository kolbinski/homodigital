<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Znaj Siebie — Homo Digital</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      height: 100%;
      overflow: hidden;
      font-family:
        'DM Sans',
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;
      color: #e0ddd5;
      background: #0c0c0f;
    "
  >
    <div
      id="app"
      style="
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      "
    >
      <div
        style="
          padding: 0.65rem 1.25rem;
          border-bottom: 1px solid #252528;
          display: flex;
          justify-content: space-between;
          align-items: center;
          background: #111114;
          flex-shrink: 0;
          z-index: 10;
        "
      >
        <span
          id="headerTitle"
          style="
            font-size: 1.15rem;
            font-weight: 700;
            color: #c4b99a;
            font-family: Georgia, 'Times New Roman', serif;
          "
          >Znaj Siebie</span
        >
        <div style="display: flex; gap: 0.6rem; align-items: center">
          <button
            id="rezBadge"
            onclick="openRezPanel()"
            style="
              display: none;
              align-items: center;
              gap: 0.35rem;
              padding: 0.2rem 0.6rem;
              border-radius: 20px;
              cursor: pointer;
              border: none;
              outline: none;
              background: #b8783d22;
              font-family: 'DM Sans', sans-serif;
            "
          >
            <div
              id="rezBadgeDot"
              style="
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #b8783d;
              "
            ></div>
            <span
              id="rezBadgeNum"
              style="
                font-size: 0.82rem;
                font-family: monospace;
                font-weight: 600;
                color: #b8783d;
              "
              >0.30</span
            >
          </button>
          <button
            id="langBtn"
            onclick="toggleLang()"
            style="
              padding: 0.2rem 0.5rem;
              background: transparent;
              color: #bbb;
              border: 1px solid #444;
              border-radius: 3px;
              font-size: 0.7rem;
              cursor: pointer;
              font-family: 'DM Sans', sans-serif;
              letter-spacing: 0.08em;
              font-weight: 600;
            "
          >
            EN
          </button>
        </div>
      </div>

      <div
        id="rezOverlay"
        style="
          position: absolute;
          inset: 0;
          z-index: 50;
          background: #0c0c0f;
          display: none;
          flex-direction: column;
        "
      >
        <div
          style="
            padding: 0.65rem 1.25rem;
            border-bottom: 1px solid #252528;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
          "
        >
          <span
            id="rezOverlayTitle"
            style="font-size: 0.85rem; font-weight: 600; color: #c4b99a"
            >Twój rezonans</span
          >
          <button
            id="closeOverlayBtn"
            onclick="closeRezPanel()"
            style="
              padding: 0.3rem 0.7rem;
              background: transparent;
              color: #bbb;
              border: 1px solid #444;
              border-radius: 4px;
              font-size: 0.78rem;
              cursor: pointer;
              font-family: 'DM Sans', sans-serif;
            "
          >
            Zamknij
          </button>
        </div>
        <div
          id="rezDisplayMobile"
          style="padding: 1.5rem 1.25rem 1rem; flex-shrink: 0"
        ></div>
        <div
          id="timelineScrollMobile"
          style="
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 1.25rem 1.5rem;
            min-height: 0;
          "
        ></div>
      </div>

      <div style="display: flex; flex: 1; min-height: 0">
        <div
          style="flex: 1; display: flex; flex-direction: column; min-width: 0"
        >
          <div
            id="topicsView"
            style="
              padding: 1.5rem;
              overflow-y: auto;
              flex: 1;
              max-width: 720px;
              margin: 0 auto;
              width: 100%;
            "
          ></div>

          <div
            id="chatView"
            style="
              display: none;
              flex: 1;
              flex-direction: column;
              min-height: 0;
            "
          >
            <div
              style="
                padding: 0.45rem 1.1rem;
                border-bottom: 1px solid #1e1e22;
                flex-shrink: 0;
              "
            >
              <button
                id="backBtn"
                onclick="goBack()"
                style="
                  background: transparent;
                  border: none;
                  color: #bbb;
                  cursor: pointer;
                  font-family: 'DM Sans', sans-serif;
                  font-size: 0.82rem;
                  padding: 0.25rem 0;
                "
              >
                ← Wróć do tematyk
              </button>
            </div>
            <div
              id="chatMessages"
              style="
                flex: 1;
                overflow-y: auto;
                padding: 1rem 1.25rem;
                max-width: 720px;
                margin: 0 auto;
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 0.6rem;
              "
            ></div>
            <div
              style="
                padding: 0.6rem 1rem;
                max-width: 720px;
                margin: 0 auto;
                width: 100%;
                border-top: 1px solid #1e1e22;
                display: flex;
                gap: 0.5rem;
                flex-shrink: 0;
                align-items: flex-end;
              "
            >
              <textarea
                id="chatInput"
                rows="1"
                placeholder="Twoja odpowiedź..."
                style="
                  flex: 1;
                  padding: 0.65rem 0.9rem;
                  background: #1c1c24;
                  color: #e0ddd5;
                  border: 1px solid #3a3a45;
                  border-radius: 8px;
                  font-family: 'DM Sans', sans-serif;
                  font-size: 0.9rem;
                  outline: none;
                  resize: none;
                  max-height: 120px;
                  line-height: 1.5;
                  overflow: auto;
                "
              ></textarea>
              <button
                id="sendBtn"
                disabled
                onclick="doSend()"
                style="
                  padding: 0.65rem 1.3rem;
                  background: #252528;
                  color: #666;
                  border: none;
                  border-radius: 8px;
                  font-family: 'DM Sans', sans-serif;
                  font-size: 0.85rem;
                  font-weight: 600;
                  cursor: pointer;
                  flex-shrink: 0;
                "
              >
                Wyślij
              </button>
            </div>
          </div>
        </div>

        <div
          id="rightPanel"
          style="
            width: 290px;
            border-left: 1px solid #1e1e22;
            background: #0e0e12;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            min-height: 0;
          "
        >
          <div
            id="rezDisplayDesktop"
            style="padding: 1rem 1rem 0.75rem; flex-shrink: 0"
          ></div>
          <div
            style="
              flex: 1;
              overflow-y: auto;
              padding: 0.5rem 1rem 1rem;
              min-height: 0;
            "
          >
            <div
              id="tlStickyDesktop"
              style="
                font-size: 0.65rem;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: #999;
                font-weight: 600;
                position: sticky;
                top: 0;
                background: #0e0e12;
                padding-bottom: 0.4rem;
                padding-top: 0.1rem;
                z-index: 2;
              "
            >
              Timeline
            </div>
            <div
              id="tlEntriesDesktop"
              style="display: flex; flex-direction: column; gap: 0.3rem"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_URL = 'https://homodigital-api.olbik80.workers.dev/';
      const TEXTS = {
        pl: {
          title: 'Znaj Siebie',
          topics: 'Tematyki z odcinka',
          free: 'Własny temat',
          freePlaceholder: 'Napisz o czym chcesz porozmawiać...',
          chatPlaceholder: 'Twoja odpowiedź...',
          send: 'Wyślij',
          thinking: 'Myślę...',
          rezPanel: 'Twój rezonans',
          timeline: 'Timeline',
          noEntries: 'Zacznij rozmowę — tu pojawi się twoja historia',
          closed: '✓',
          back: '← Wróć do tematyk',
          langSwitch: 'EN',
          continuing: '● kontynuacja',
          closePanel: 'Zamknij',
        },
        en: {
          title: 'Know Yourself',
          topics: 'Episode Topics',
          free: 'Free Topic',
          freePlaceholder: 'Write what you want to talk about...',
          chatPlaceholder: 'Your response...',
          send: 'Send',
          thinking: 'Thinking...',
          rezPanel: 'Your Resonance',
          timeline: 'Timeline',
          noEntries: 'Start a conversation — your history will appear here',
          closed: '✓',
          back: '← Back to topics',
          langSwitch: 'PL',
          continuing: '● continuing',
          closePanel: 'Close',
        },
      };
      let tesseractBase = '';
      const ZNAJ_SIEBIE_PL = `\n\n=== ZNAJ SIEBIE — KONTEKST PROGRAMU ===\n\nDziałasz jako partner rozmowy w programie "Znaj Siebie".\n\nZASADY PROGRAMU:\n- Jesteś ciepły, ale uczciwy. Partner, nie terapeuta.\n- NIE STAWIAJ DIAGNOZ. Jeśli widzisz coś niepokojącego, delikatnie zasugeruj rozmowę z zaufaną osobą.\n- Odpowiadaj krótko (2-4 zdania), nie pisz esejów.\n- Gdy temat jest wyczerpany (widz powiedział wszystko, rozmowa się kręci w kółko, widz powtarza te same punkty) — ustaw topic_closed na true i w response napisz krótkie, ciepłe podsumowanie tego co widz odkrył o sobie.\n\nODPOWIADAJ WYŁĄCZNIE W FORMACIE JSON (bez markdown, bez backticks):\n{"response":"twoja odpowiedź","rez":0.5,"rez_reason":"krótki powód zmiany rez","surprise":null,"topic_closed":false}\n\nrez: liczba 0.0-0.95 (NIGDY nie dawaj 1.0) opisująca głębokość samopoznania widza.\n  0.2-0.4 = początek, powierzchowna wymiana\n  0.5-0.6 = widz zaczyna się otwierać\n  0.7-0.8 = prawdziwa szczerość, głębokie samopoznanie\n  0.85-0.95 = wyjątkowy moment autentyczności\n  rez zmienia się z granulacją 0.01 — używaj pełnego zakresu (np. 0.33, 0.47, 0.62, 0.71, 0.88). NIE zaokrąglaj do 0.05. Każda odpowiedź widza to unikalna głębokość — rez powinien to odzwierciedlać precyzyjnie.\n\nsurprise: null jeśli brak, albo krótki opis jeśli widz powiedział coś naprawdę nieoczekiwanego\n\nZaczynaj od rez ~0.3.`;
      const ZNAJ_SIEBIE_EN = `\n\n=== KNOW YOURSELF — SHOW CONTEXT ===\n\nYou are a conversation partner in the "Know Yourself" show.\n\nSHOW RULES:\n- Be warm but honest. Partner, not therapist.\n- DO NOT DIAGNOSE. If you see something concerning, gently suggest talking to a trusted person.\n- Keep responses short (2-4 sentences), no essays.\n- When topic is exhausted (viewer said everything, conversation loops, same points repeated) — set topic_closed to true and write a brief, warm summary of what the viewer discovered about themselves.\n\nRESPOND ONLY IN JSON FORMAT (no markdown, no backticks):\n{"response":"your response","rez":0.5,"rez_reason":"short reason for rez level","surprise":null,"topic_closed":false}\n\nrez: number 0.0-0.95 (NEVER give 1.0) describing depth of self-knowledge.\n  0.2-0.4 = beginning, surface exchange\n  0.5-0.6 = viewer starting to open up\n  0.7-0.8 = real honesty, deep self-knowledge\n  0.85-0.95 = exceptional moment of authenticity\n  rez changes with 0.01 granularity — use the full range (e.g. 0.33, 0.47, 0.62, 0.71, 0.88). DO NOT round to 0.05. Every viewer response has unique depth — rez should reflect that precisely.\n\nsurprise: null if none, or short description if viewer said something truly unexpected\n\nStart from rez ~0.3.`;
      let lang = 'pl',
        view = 'topics',
        activeTopic = null,
        convos = {},
        loading = false,
        rez = 0.3,
        entries = [],
        closedTopics = new Set(),
        openEpisodes = new Set(['ep1']),
        episodesData = { pl: [], en: [] };
      function t() {
        return TEXTS[lang];
      }
      function sys() {
        return (
          tesseractBase + (lang === 'pl' ? ZNAJ_SIEBIE_PL : ZNAJ_SIEBIE_EN)
        );
      }
      function ts() {
        return new Date().toISOString();
      }
      function formatTs(isoStr) {
        const d = new Date(isoStr),
          now = new Date(),
          time = d.toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit',
          }),
          sameDay =
            d.getDate() === now.getDate() &&
            d.getMonth() === now.getMonth() &&
            d.getFullYear() === now.getFullYear();
        if (sameDay) return time;
        const dd = String(d.getDate()).padStart(2, '0'),
          mm = String(d.getMonth() + 1).padStart(2, '0');
        if (d.getFullYear() === now.getFullYear())
          return dd + '/' + mm + ' ' + time;
        return dd + '/' + mm + '/' + d.getFullYear() + ' ' + time;
      }
      function rc(r) {
        return r >= 0.8
          ? '#3db86a'
          : r >= 0.6
            ? '#5a9e5a'
            : r >= 0.4
              ? '#b8a83d'
              : r >= 0.2
                ? '#b8783d'
                : '#8e4444';
      }
      function rl(r) {
        if (lang === 'pl')
          return r >= 0.85
            ? 'Głęboki rezonans'
            : r >= 0.7
              ? 'Otwarcie'
              : r >= 0.5
                ? 'Rozmowa'
                : r >= 0.3
                  ? 'Początek'
                  : 'Transakcja';
        return r >= 0.85
          ? 'Deep resonance'
          : r >= 0.7
            ? 'Opening up'
            : r >= 0.5
              ? 'Conversation'
              : r >= 0.3
                ? 'Starting'
                : 'Transaction';
      }
      function parseAI(raw) {
        try {
          return JSON.parse(
            raw
              .replace(/```json\s*/g, '')
              .replace(/```\s*/g, '')
              .trim(),
          );
        } catch (e) {
          return {
            response: raw,
            rez,
            rez_reason: '',
            surprise: null,
            topic_closed: false,
          };
        }
      }
      async function callAPI(messages) {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages, system: sys(), max_tokens: 500 }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        return data.text;
      }
      function handleParsed(parsed, topicId, aiId) {
        rez = Math.min(parsed.rez || rez, 0.95);
        const time = ts();
        entries.push({
          type: 'rez',
          rez,
          reason: parsed.rez_reason || '',
          time,
          msgId: aiId,
          topicId,
        });
        if (parsed.surprise)
          entries.push({
            type: 'surprise',
            text: parsed.surprise,
            time,
            msgId: aiId,
            topicId,
          });
        if (parsed.topic_closed) closedTopics.add(topicId);
      }

      function render() {
        document.getElementById('headerTitle').textContent = t().title;
        document.getElementById('langBtn').textContent = t().langSwitch;
        document.getElementById('backBtn').textContent = t().back;
        document.getElementById('rezOverlayTitle').textContent = t().rezPanel;
        document.getElementById('closeOverlayBtn').textContent = t().closePanel;
        document.getElementById('sendBtn').textContent = t().send;
        var badge = document.getElementById('rezBadge');
        badge.style.background = rc(rez) + '22';
        badge.style.border = '1px solid ' + rc(rez) + '44';
        document.getElementById('rezBadgeDot').style.background = rc(rez);
        document.getElementById('rezBadgeNum').style.color = rc(rez);
        document.getElementById('rezBadgeNum').textContent = rez.toFixed(2);
        renderRezDisplay('rezDisplayDesktop');
        renderRezDisplay('rezDisplayMobile');
        renderTimeline('tlEntriesDesktop', 'tlStickyDesktop');
        renderTimelineMobile();
        if (view === 'topics') {
          document.getElementById('topicsView').style.display = '';
          document.getElementById('chatView').style.display = 'none';
          renderTopics();
        } else {
          document.getElementById('topicsView').style.display = 'none';
          document.getElementById('chatView').style.display = 'flex';
          renderChat();
        }
      }

      function renderRezDisplay(id) {
        var el = document.getElementById(id);
        el.innerHTML =
          '<div style="font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:#999;font-weight:600;margin-bottom:0.5rem">' +
          t().rezPanel +
          '</div><div style="font-size:2.8rem;font-family:monospace;font-weight:bold;line-height:1;text-align:center;padding:0.5rem 0;color:' +
          rc(rez) +
          '">' +
          rez.toFixed(2) +
          '</div><div style="font-size:0.78rem;font-weight:500;text-align:center;margin-top:0.35rem;color:' +
          rc(rez) +
          '">' +
          rl(rez) +
          '</div><div style="height:4px;background:#1e1e24;border-radius:2px;overflow:hidden;margin-top:0.5rem"><div style="height:100%;border-radius:2px;width:' +
          Math.min(rez / 0.95, 1) * 100 +
          '%;background:' +
          rc(rez) +
          '"></div></div>';
      }

      function renderTimeline(entriesId, stickyId) {
        var sEl = document.getElementById(stickyId);
        if (sEl) sEl.textContent = t().timeline;
        var el = document.getElementById(entriesId);
        if (!el) return;
        if (entries.length === 0) {
          el.innerHTML =
            '<div style="font-size:0.78rem;color:#777;font-style:italic;line-height:1.5">' +
            t().noEntries +
            '</div>';
          return;
        }
        el.innerHTML = entries
          .map(function (e) {
            var isS = e.type === 'surprise';
            var borderColor = isS ? '#c4b44a' : rc(e.rez || 0);
            var bg = isS ? '#1e1c10' : '#14141a';
            var labelStyle = isS
              ? 'color:#c4b44a;font-weight:600'
              : 'font-family:monospace;font-weight:600;color:' + rc(e.rez);
            var labelText = isS ? '✦ zaskoczenie' : (e.rez || 0).toFixed(2);
            return (
              '<div style="padding:0.4rem 0.55rem;border-radius:0 4px 4px 0;font-size:0.73rem;cursor:pointer;border-left:2px solid ' +
              borderColor +
              ';background:' +
              bg +
              '" onclick="scrollToMsg(' +
              e.msgId +
              ",'" +
              e.topicId +
              '\')"><div style="display:flex;justify-content:space-between;margin-bottom:0.1rem"><span style="' +
              labelStyle +
              '">' +
              labelText +
              '</span><span style="color:#888;font-size:0.68rem">' +
              formatTs(e.time) +
              '</span></div><div style="color:#ddd;line-height:1.4">' +
              (isS ? e.text : e.reason) +
              '</div></div>'
            );
          })
          .join('');
      }

      function renderTimelineMobile() {
        var container = document.getElementById('timelineScrollMobile');
        container.innerHTML =
          '<div style="font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:#999;font-weight:600;position:sticky;top:0;background:#0c0c0f;padding-bottom:0.4rem;padding-top:0.1rem;z-index:2">' +
          t().timeline +
          '</div><div id="tlEntriesMobile" style="display:flex;flex-direction:column;gap:0.3rem"></div>';
        renderTimeline('tlEntriesMobile', null);
      }

      function renderTopics() {
        var tv = document.getElementById('topicsView');
        var html = '';
        episodesData[lang].forEach(function (ep) {
          var isOpen = openEpisodes.has(ep.id);
          html +=
            '<div style="margin-bottom:1rem"><button onclick="toggleEp(\'' +
            ep.id +
            '\')" style="width:100%;text-align:left;padding:0.6rem 0;background:transparent;border:none;color:#c4b99a;font-family:\'DM Sans\',sans-serif;font-size:0.82rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:0.5rem;border-bottom:1px solid #252528;margin-bottom:0.75rem"><span style="font-size:0.7rem;display:inline-block;' +
            (isOpen ? 'transform:rotate(90deg)' : '') +
            '">▶</span>' +
            ep.label +
            '</button>';
          if (isOpen) {
            html +=
              '<div style="display:flex;flex-direction:column;gap:0.45rem">';
            ep.topics.forEach(function (tp) {
              var isClosed = closedTopics.has(tp.id),
                hasConvo = convos[tp.id] && convos[tp.id].length > 0;
              var btnBg = isClosed ? '#111' : '#16161a';
              var btnColor = isClosed ? '#999' : '#e0ddd5';
              var btnBorder = isClosed ? '#252528' : '#2e2e35';
              html +=
                '<button onclick="openTopic(\'' +
                tp.id +
                '\')" style="padding:0.8rem 1rem;background:' +
                btnBg +
                ';color:' +
                btnColor +
                ';border:1px solid ' +
                btnBorder +
                ";border-radius:8px;text-align:left;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.92rem;line-height:1.5;display:flex;align-items:center;gap:0.5rem\">" +
                (isClosed
                  ? '<span style="color:#3db86a;font-size:0.9rem;flex-shrink:0">' +
                    t().closed +
                    '</span>'
                  : '') +
                '<span style="flex:1">' +
                tp.label +
                '</span>' +
                (hasConvo && !isClosed
                  ? '<span style="font-size:0.7rem;color:#aaa;flex-shrink:0">' +
                    t().continuing +
                    '</span>'
                  : '') +
                '</button>';
            });
            html += '</div>';
          }
          html += '</div>';
        });
        html +=
          '<div style="margin-top:0.5rem;padding-top:1rem;border-top:1px solid #252528"><div style="font-size:0.82rem;letter-spacing:0.1em;text-transform:uppercase;color:#c4b99a;margin-bottom:0.75rem;font-weight:600">' +
          t().free +
          '</div><input id="freeInput" placeholder="' +
          t().freePlaceholder +
          "\" style=\"width:100%;padding:0.7rem 0.9rem;background:#16161a;color:#e0ddd5;border:1px solid #2e2e35;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none\" onkeydown=\"if(event.key==='Enter'&&this.value.trim()){startFree(this.value);this.value='';}\" /></div>";
        tv.innerHTML = html;
      }

      function renderChat() {
        var msgs = convos[activeTopic] || [],
          cm = document.getElementById('chatMessages'),
          topicIsClosed = closedTopics.has(activeTopic);
        var html = msgs
          .map(function (m) {
            var isUser = m.role === 'user';
            var align = isUser ? 'flex-end' : 'flex-start';
            var bubbleBg = isUser ? '#1a2230' : '#18181e';
            var bubbleBorder = isUser
              ? '1px solid #2b4a6f44'
              : '1px solid #2e2e38';
            var bubbleColor = isUser ? '#a8c4e0' : '#e0ddd5';
            var bubbleRadius = isUser
              ? '14px 14px 3px 14px'
              : '14px 14px 14px 3px';
            return (
              '<div id="msg-' +
              m.id +
              '" style="max-width:82%;border-radius:16px;align-self:' +
              align +
              '"><div style="padding:0.7rem 1rem;font-size:0.9rem;line-height:1.7;border-radius:' +
              bubbleRadius +
              ';background:' +
              bubbleBg +
              ';border:' +
              bubbleBorder +
              ';color:' +
              bubbleColor +
              '">' +
              escHtml(m.text) +
              '</div></div>'
            );
          })
          .join('');
        if (loading)
          html +=
            '<div style="align-self:flex-start;padding:0.7rem 1rem;background:#18181e;border:1px solid #2e2e38;border-radius:14px 14px 14px 3px;font-size:0.85rem;color:#999">' +
            t().thinking +
            '</div>';
        if (topicIsClosed && !loading) {
          var closeMsg =
            lang === 'pl'
              ? 'Temat zamknięty. Wróć do tematyk, żeby wybrać kolejny.'
              : 'Topic closed. Go back to topics to pick another one.';
          html +=
            '<div style="text-align:center;padding:1rem 0;color:#999;font-size:0.82rem;font-style:italic;border-top:1px solid #252528;margin-top:0.5rem">' +
            closeMsg +
            '</div>';
        }
        cm.innerHTML = html;
        requestAnimationFrame(function () {
          cm.scrollTop = cm.scrollHeight;
        });
        var ta = document.getElementById('chatInput'),
          sb = document.getElementById('sendBtn');
        sb.textContent = t().send;
        var dis = loading || !ta.value.trim() || topicIsClosed;
        sb.disabled = dis;
        sb.style.background = dis ? '#252528' : '#2b4a6f';
        sb.style.color = dis ? '#666' : '#fff';
        sb.style.cursor = dis ? 'default' : 'pointer';
        if (topicIsClosed) {
          ta.disabled = true;
          ta.style.color = '#666';
          ta.style.background = '#111';
          ta.placeholder = lang === 'pl' ? 'Temat zamknięty' : 'Topic closed';
        } else {
          ta.disabled = false;
          ta.style.color = '#e0ddd5';
          ta.style.background = '#1c1c24';
          ta.placeholder = t().chatPlaceholder;
        }
      }

      function escHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }
      function toggleLang() {
        lang = lang === 'pl' ? 'en' : 'pl';
        render();
        saveState();
      }
      function toggleEp(id) {
        openEpisodes.has(id) ? openEpisodes.delete(id) : openEpisodes.add(id);
        render();
      }
      function goBack() {
        view = 'topics';
        activeTopic = null;
        render();
      }
      function openRezPanel() {
        document.getElementById('rezOverlay').style.display = 'flex';
      }
      function closeRezPanel() {
        document.getElementById('rezOverlay').style.display = 'none';
      }
      function findTopic(topicId) {
        for (var i = 0; i < episodesData[lang].length; i++) {
          var ep = episodesData[lang][i];
          for (var j = 0; j < ep.topics.length; j++) {
            if (ep.topics[j].id === topicId) return ep.topics[j];
          }
        }
        return null;
      }
      async function openTopic(topicId) {
        activeTopic = topicId;
        view = 'chat';
        render();
        if (convos[topicId] && convos[topicId].length) return;
        var tp = findTopic(topicId);
        if (!tp) return;
        loading = true;
        render();
        try {
          var prompt =
            lang === 'pl'
              ? 'Tematyka rozmowy: "' +
                tp.opener +
                '". Zacznij rozmowę — przywitaj się krótko i zadaj pierwsze pytanie widzowi.'
              : 'Conversation topic: "' +
                tp.opener +
                '". Start the conversation — greet briefly and ask the viewer your first question.';
          var raw = await callAPI([{ role: 'user', content: prompt }]);
          var parsed = parseAI(raw);
          var aId = Date.now();
          convos[topicId] = [
            { role: 'assistant', text: parsed.response, raw: raw, id: aId },
          ];
          handleParsed(parsed, topicId, aId);
        } catch (e) {
          convos[topicId] = [
            {
              role: 'assistant',
              text: 'Cześć! Opowiedz mi...',
              id: Date.now(),
            },
          ];
        }
        loading = false;
        render();
        saveState();
      }
      async function startFree(text) {
        var freeId = 'free_' + Date.now();
        activeTopic = freeId;
        view = 'chat';
        loading = true;
        render();
        try {
          var raw = await callAPI([{ role: 'user', content: text }]);
          var parsed = parseAI(raw);
          var uId = Date.now(),
            aId = uId + 1;
          convos[freeId] = [
            { role: 'user', text: text, id: uId },
            { role: 'assistant', text: parsed.response, raw: raw, id: aId },
          ];
          handleParsed(parsed, freeId, aId);
        } catch (e) {
          convos[freeId] = [
            { role: 'user', text: text, id: Date.now() },
            { role: 'assistant', text: 'Błąd...', id: Date.now() + 1 },
          ];
        }
        loading = false;
        render();
        saveState();
      }
      async function doSend() {
        var ta = document.getElementById('chatInput'),
          text = ta.value.trim();
        if (!text || !activeTopic) return;
        var uId = Date.now();
        if (!convos[activeTopic]) convos[activeTopic] = [];
        convos[activeTopic].push({ role: 'user', text: text, id: uId });
        ta.value = '';
        ta.style.height = 'auto';
        loading = true;
        render();
        try {
          var history = convos[activeTopic].map(function (m) {
            return {
              role: m.role === 'user' ? 'user' : 'assistant',
              content: m.role === 'user' ? m.text : m.raw || m.text,
            };
          });
          var raw = await callAPI(history);
          var parsed = parseAI(raw);
          var aId = Date.now();
          convos[activeTopic].push({
            role: 'assistant',
            text: parsed.response,
            raw: raw,
            id: aId,
          });
          handleParsed(parsed, activeTopic, aId);
        } catch (e) {
          convos[activeTopic].push({
            role: 'assistant',
            text: 'Błąd połączenia.',
            id: Date.now(),
          });
        }
        loading = false;
        render();
        saveState();
      }
      function scrollToMsg(msgId, topicId) {
        closeRezPanel();
        if (topicId && topicId !== activeTopic) {
          activeTopic = topicId;
          view = 'chat';
          render();
        }
        setTimeout(function () {
          var el = document.getElementById('msg-' + msgId);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 200);
      }
      document
        .getElementById('chatInput')
        .addEventListener('input', function () {
          this.style.height = 'auto';
          this.style.height = Math.min(this.scrollHeight, 120) + 'px';
          document.getElementById('sendBtn').disabled =
            loading || !this.value.trim();
        });
      document
        .getElementById('chatInput')
        .addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey && !loading) {
            e.preventDefault();
            doSend();
          }
        });
      function saveState() {
        try {
          localStorage.setItem('zs_convos', JSON.stringify(convos));
          localStorage.setItem('zs_entries', JSON.stringify(entries));
          localStorage.setItem('zs_rez', JSON.stringify(rez));
          localStorage.setItem('zs_closed', JSON.stringify([...closedTopics]));
          localStorage.setItem('zs_lang', lang);
        } catch (e) {}
      }
      function loadState() {
        try {
          var c = localStorage.getItem('zs_convos');
          if (c) convos = JSON.parse(c);
          var e = localStorage.getItem('zs_entries');
          if (e) entries = JSON.parse(e);
          var r = localStorage.getItem('zs_rez');
          if (r) rez = JSON.parse(r);
          var cl = localStorage.getItem('zs_closed');
          if (cl) closedTopics = new Set(JSON.parse(cl));
          var l = localStorage.getItem('zs_lang');
          if (l) lang = l;
        } catch (e) {}
      }
      async function init() {
        loadState();
        try {
          var r = await Promise.all([
            fetch('episodes.json'),
            fetch('../tesseract.txt'),
          ]);
          episodesData = await r[0].json();
          tesseractBase = await r[1].text();
        } catch (e) {
          console.error('Failed to load config:', e);
        }
        render();
      }
      init();
    </script>
  </body>
</html>
