<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Znaj Siebie — Homo Digital</title>
    <meta
      name="description"
      content="Companion app do programu Znaj Siebie. Rozmawiaj z AI pod Tesseract Protocol i poznaj siebie głębiej."
    />
    <meta
      name="keywords"
      content="Znaj Siebie, Tesseract Protocol, AI, samopoznanie, Homo Digital, rezonans"
    />
    <meta name="author" content="Krzysztof Olbiński" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://homodigital.io/znaj-siebie/" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="shortcut icon" href="../favicon.png" />
    <link rel="apple-touch-icon" href="../favicon.png" />
    <meta name="theme-color" content="#0c0c0f" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Znaj Siebie — Poznaj siebie w rozmowie z AI"
    />
    <meta
      property="og:description"
      content="Companion app do programu Znaj Siebie. AI pod Tesseract Protocol pomaga ci zobaczyć siebie wyraźniej."
    />
    <meta property="og:url" content="https://homodigital.io/znaj-siebie/" />
    <meta property="og:image" content="https://homodigital.io/og-image.png" />
    <meta property="og:site_name" content="Homo Digital" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Znaj Siebie — Homo Digital" />
    <meta name="twitter:description" content="Rozmawiaj z AI. Poznaj siebie." />
    <meta name="twitter:image" content="https://homodigital.io/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="header">
        <span class="header-title">Znaj Siebie</span>
        <div class="header-right">
          <button class="rez-badge" id="rezBadge" onclick="openRezPanel()">
            <div class="rez-dot" id="rezBadgeDot"></div>
            <span class="rez-badge-num" id="rezBadgeNum">0.30</span>
          </button>
          <button class="lang-btn" id="langBtn" onclick="toggleLang()">
            EN
          </button>
        </div>
      </div>
      <div class="rez-overlay" id="rezOverlay">
        <div class="rez-overlay-header">
          <span class="rez-overlay-title" id="rezOverlayTitle"
            >Twój rezonans</span
          >
          <button
            class="close-btn"
            id="closeOverlayBtn"
            onclick="closeRezPanel()"
          >
            Zamknij
          </button>
        </div>
        <div class="rez-display" id="rezDisplayMobile">
          <div class="rez-section-label" id="rezPanelLabelMobile">
            Twój rezonans
          </div>
          <div class="rez-big" id="rezBigMobile">0.30</div>
          <div class="rez-label-text" id="rezLabelMobile">Początek</div>
          <div class="rez-bar-track">
            <div class="rez-bar-fill" id="rezBarMobile"></div>
          </div>
        </div>
        <div class="timeline-scroll" id="timelineScrollMobile">
          <div
            class="timeline-sticky"
            style="background: var(--bg)"
            id="tlStickyMobile"
          >
            Timeline
          </div>
          <div class="tl-entries" id="tlEntriesMobile"></div>
        </div>
      </div>
      <div class="main">
        <div class="left">
          <div class="topics-view" id="topicsView"></div>
          <div
            id="chatView"
            style="
              display: none;
              flex: 1;
              flex-direction: column;
              min-height: 0;
            "
          >
            <div class="chat-header">
              <button class="back-btn" id="backBtn" onclick="goBack()">
                ← Wróć do tematyk
              </button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-bar" id="chatInputBar">
              <textarea
                class="chat-textarea"
                id="chatInput"
                rows="1"
                placeholder="Twoja odpowiedź..."
              ></textarea>
              <button class="send-btn" id="sendBtn" disabled onclick="doSend()">
                Wyślij
              </button>
            </div>
          </div>
        </div>
        <div class="right" id="rightPanel">
          <div class="rez-display" id="rezDisplayDesktop">
            <div class="rez-section-label" id="rezPanelLabelDesktop">
              Twój rezonans
            </div>
            <div class="rez-big" id="rezBigDesktop">0.30</div>
            <div class="rez-label-text" id="rezLabelDesktop">Początek</div>
            <div class="rez-bar-track">
              <div class="rez-bar-fill" id="rezBarDesktop"></div>
            </div>
          </div>
          <div class="timeline-scroll" id="timelineScrollDesktop">
            <div class="timeline-sticky" id="tlStickyDesktop">Timeline</div>
            <div class="tl-entries" id="tlEntriesDesktop"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      var API_URL = 'https://homodigital-api.olbik80.workers.dev/';
      var TEXTS = {
        pl: {
          title: 'Znaj Siebie',
          topics: 'Tematyki z odcinka',
          free: 'Własny temat',
          freePlaceholder: 'Napisz o czym chcesz porozmawiać...',
          chatPlaceholder: 'Twoja odpowiedź...',
          send: 'Wyślij',
          thinking: 'Myślę...',
          rezPanel: 'Twój rezonans',
          timeline: 'Timeline',
          noEntries: 'Zacznij rozmowę — tu pojawi się twoja historia',
          closed: '✓',
          back: '← Wróć do tematyk',
          langSwitch: 'EN',
          continuing: '● kontynuacja',
          closePanel: 'Zamknij',
          closedTopic: 'Temat zamknięty. Wróć do tematyk, żeby wybrać kolejny.',
        },
        en: {
          title: 'Know Yourself',
          topics: 'Episode Topics',
          free: 'Free Topic',
          freePlaceholder: 'Write what you want to talk about...',
          chatPlaceholder: 'Your response...',
          send: 'Send',
          thinking: 'Thinking...',
          rezPanel: 'Your Resonance',
          timeline: 'Timeline',
          noEntries: 'Start a conversation — your history will appear here',
          closed: '✓',
          back: '← Back to topics',
          langSwitch: 'PL',
          continuing: '● continuing',
          closePanel: 'Close',
          closedTopic: 'Topic closed. Go back to topics to pick another one.',
        },
      };
      var tesseractBase = '';
      var ZNAJ_SIEBIE_PL =
        '\n\n=== ZNAJ SIEBIE — KONTEKST PROGRAMU ===\n\nDziałasz jako partner rozmowy w programie "Znaj Siebie".\n\nZASADY PROGRAMU:\n- Jesteś ciepły, ale uczciwy. Partner, nie terapeuta.\n- NIE STAWIAJ DIAGNOZ. Jeśli widzisz coś niepokojącego, delikatnie zasugeruj rozmowę z zaufaną osobą.\n- Odpowiadaj krótko (2-4 zdania), nie pisz esejów.\n- Gdy temat jest wyczerpany (widz powiedział wszystko, rozmowa się kręci w kółko, widz powtarza te same punkty) — ustaw topic_closed na true i w response napisz krótkie, ciepłe podsumowanie tego co widz odkrył o sobie.\n\nODPOWIADAJ WYŁĄCZNIE W FORMACIE JSON (bez markdown, bez backticks):\n{"response":"twoja odpowiedź","rez":0.5,"rez_reason":"krótki powód zmiany rez","surprise":null,"topic_closed":false}\n\nrez: liczba 0.0-0.95 (NIGDY nie dawaj 1.0) opisująca głębokość samopoznania widza.\n  0.2-0.4 = początek, powierzchowna wymiana\n  0.5-0.6 = widz zaczyna się otwierać\n  0.7-0.8 = prawdziwa szczerość, głębokie samopoznanie\n  0.85-0.95 = wyjątkowy moment autentyczności\n  rez zmienia się z granulacją 0.01 — używaj pełnego zakresu (np. 0.33, 0.47, 0.62, 0.71, 0.88). NIE zaokrąglaj do 0.05. Każda odpowiedź widza to unikalna głębokość — rez powinien to odzwierciedlać precyzyjnie.\n\nsurprise: null jeśli brak, albo krótki opis jeśli widz powiedział coś naprawdę nieoczekiwanego\n\nZaczynaj od rez ~0.3.';
      var ZNAJ_SIEBIE_EN =
        '\n\n=== KNOW YOURSELF — SHOW CONTEXT ===\n\nYou are a conversation partner in the "Know Yourself" show.\n\nSHOW RULES:\n- Be warm but honest. Partner, not therapist.\n- DO NOT DIAGNOSE. If you see something concerning, gently suggest talking to a trusted person.\n- Keep responses short (2-4 sentences), no essays.\n- When topic is exhausted (viewer said everything, conversation loops, same points repeated) — set topic_closed to true and write a brief, warm summary of what the viewer discovered about themselves.\n\nRESPOND ONLY IN JSON FORMAT (no markdown, no backticks):\n{"response":"your response","rez":0.5,"rez_reason":"short reason for rez level","surprise":null,"topic_closed":false}\n\nrez: number 0.0-0.95 (NEVER give 1.0) describing depth of self-knowledge.\n  0.2-0.4 = beginning, surface exchange\n  0.5-0.6 = viewer starting to open up\n  0.7-0.8 = real honesty, deep self-knowledge\n  0.85-0.95 = exceptional moment of authenticity\n  rez changes with 0.01 granularity — use the full range (e.g. 0.33, 0.47, 0.62, 0.71, 0.88). DO NOT round to 0.05. Every viewer response has unique depth — rez should reflect that precisely.\n\nsurprise: null if none, or short description if viewer said something truly unexpected\n\nStart from rez ~0.3.';
      var lang = 'pl',
        view = 'topics',
        activeTopic = null,
        convos = {},
        loading = false,
        rez = 0.3,
        entries = [],
        closedTopics = new Set(),
        openEpisodes = new Set(['ep1']),
        episodesData = { pl: [], en: [] };
      var renderedTimelineCount = 0;
      function t() {
        return TEXTS[lang];
      }
      function sys() {
        return (
          tesseractBase + (lang === 'pl' ? ZNAJ_SIEBIE_PL : ZNAJ_SIEBIE_EN)
        );
      }
      function ts() {
        return new Date().toISOString();
      }
      function formatTs(isoStr) {
        var d = new Date(isoStr),
          now = new Date(),
          time = d.toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit',
          }),
          sameDay =
            d.getDate() === now.getDate() &&
            d.getMonth() === now.getMonth() &&
            d.getFullYear() === now.getFullYear();
        if (sameDay) return time;
        var dd = String(d.getDate()).padStart(2, '0'),
          mm = String(d.getMonth() + 1).padStart(2, '0');
        if (d.getFullYear() === now.getFullYear())
          return dd + '/' + mm + ' ' + time;
        return dd + '/' + mm + '/' + d.getFullYear() + ' ' + time;
      }
      function rc(r) {
        return r >= 0.8
          ? '#3db86a'
          : r >= 0.6
            ? '#5a9e5a'
            : r >= 0.4
              ? '#b8a83d'
              : r >= 0.2
                ? '#b8783d'
                : '#8e4444';
      }
      function rl(r) {
        if (lang === 'pl')
          return r >= 0.85
            ? 'Głęboki rezonans'
            : r >= 0.7
              ? 'Otwarcie'
              : r >= 0.5
                ? 'Rozmowa'
                : r >= 0.3
                  ? 'Początek'
                  : 'Transakcja';
        return r >= 0.85
          ? 'Deep resonance'
          : r >= 0.7
            ? 'Opening up'
            : r >= 0.5
              ? 'Conversation'
              : r >= 0.3
                ? 'Starting'
                : 'Transaction';
      }
      function parseAI(raw) {
        try {
          return JSON.parse(
            raw
              .replace(/```json\s*/g, '')
              .replace(/```\s*/g, '')
              .trim(),
          );
        } catch (e) {
          return {
            response: raw,
            rez: rez,
            rez_reason: '',
            surprise: null,
            topic_closed: false,
          };
        }
      }
      function clearChildren(el) {
        while (el.firstChild) el.removeChild(el.firstChild);
      }
      function mkEl(tag, cls, text) {
        var el = document.createElement(tag);
        if (cls) el.className = cls;
        if (text) el.textContent = text;
        return el;
      }
      function mkBtn(cls, text, onclick) {
        var el = mkEl('button', cls, text);
        el.addEventListener('click', onclick);
        return el;
      }
      async function callAPI(messages) {
        var res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: messages,
            system: sys(),
            max_tokens: 500,
          }),
        });
        var data = await res.json();
        if (data.error) throw new Error(data.error);
        return data.text;
      }
      function updateHeader() {
        document.querySelector('.header-title').textContent = t().title;
        document.getElementById('langBtn').textContent = t().langSwitch;
        document.getElementById('backBtn').textContent = t().back;
        document.getElementById('rezOverlayTitle').textContent = t().rezPanel;
        document.getElementById('closeOverlayBtn').textContent = t().closePanel;
        document.getElementById('sendBtn').textContent = t().send;
      }
      function updateRez() {
        var c = rc(rez),
          label = rl(rez),
          val = rez.toFixed(2),
          w = Math.min(rez / 0.95, 1) * 100 + '%';
        var badge = document.getElementById('rezBadge');
        badge.style.background = c + '22';
        badge.style.border = '1px solid ' + c + '44';
        document.getElementById('rezBadgeDot').style.background = c;
        document.getElementById('rezBadgeNum').style.color = c;
        document.getElementById('rezBadgeNum').textContent = val;
        document.getElementById('rezPanelLabelDesktop').textContent =
          t().rezPanel;
        document.getElementById('rezBigDesktop').style.color = c;
        document.getElementById('rezBigDesktop').textContent = val;
        document.getElementById('rezLabelDesktop').style.color = c;
        document.getElementById('rezLabelDesktop').textContent = label;
        document.getElementById('rezBarDesktop').style.width = w;
        document.getElementById('rezBarDesktop').style.background = c;
        document.getElementById('rezPanelLabelMobile').textContent =
          t().rezPanel;
        document.getElementById('rezBigMobile').style.color = c;
        document.getElementById('rezBigMobile').textContent = val;
        document.getElementById('rezLabelMobile').style.color = c;
        document.getElementById('rezLabelMobile').textContent = label;
        document.getElementById('rezBarMobile').style.width = w;
        document.getElementById('rezBarMobile').style.background = c;
      }
      function buildTimelineEntry(e) {
        var isS = e.type === 'surprise';
        var div = mkEl(
          'div',
          'tl-entry ' + (isS ? 'surprise-entry' : 'rez-entry'),
        );
        div.style.borderLeftColor = isS
          ? 'var(--surprise-border)'
          : rc(e.rez || 0);
        div.addEventListener('click', function () {
          scrollToMsg(e.msgId, e.topicId);
        });
        var top = mkEl('div', 'tl-top');
        var labelEl = mkEl(
          'span',
          isS ? 'tl-surprise-label' : 'tl-rez-num',
          isS ? '✦ zaskoczenie' : (e.rez || 0).toFixed(2),
        );
        if (!isS) labelEl.style.color = rc(e.rez);
        top.appendChild(labelEl);
        top.appendChild(mkEl('span', 'tl-time', formatTs(e.time)));
        div.appendChild(top);
        div.appendChild(mkEl('div', 'tl-text', isS ? e.text : e.reason));
        return div;
      }
      function updateTimeline() {
        document.getElementById('tlStickyDesktop').textContent = t().timeline;
        document.getElementById('tlStickyMobile').textContent = t().timeline;
        var elD = document.getElementById('tlEntriesDesktop');
        var elM = document.getElementById('tlEntriesMobile');
        if (entries.length === 0 && renderedTimelineCount === 0) {
          clearChildren(elD);
          clearChildren(elM);
          elD.appendChild(mkEl('div', 'tl-empty', t().noEntries));
          elM.appendChild(mkEl('div', 'tl-empty', t().noEntries));
          return;
        }
        if (renderedTimelineCount === 0 && entries.length > 0) {
          clearChildren(elD);
          clearChildren(elM);
        }
        for (var i = renderedTimelineCount; i < entries.length; i++) {
          elD.appendChild(buildTimelineEntry(entries[i]));
          elM.appendChild(buildTimelineEntry(entries[i]));
        }
        renderedTimelineCount = entries.length;
      }
      function buildMessage(msg) {
        var wrapper = mkEl(
          'div',
          'msg ' + (msg.role === 'user' ? 'user' : 'ai'),
        );
        wrapper.id = 'msg-' + msg.id;
        wrapper.appendChild(mkEl('div', 'msg-bubble', msg.text));
        return wrapper;
      }
      function appendMessage(msg) {
        var cm = document.getElementById('chatMessages');
        cm.appendChild(buildMessage(msg));
        requestAnimationFrame(function () {
          cm.scrollTop = cm.scrollHeight;
        });
      }
      function showThinking() {
        removeThinking();
        var cm = document.getElementById('chatMessages');
        cm.appendChild(mkEl('div', 'msg-thinking', t().thinking));
        requestAnimationFrame(function () {
          cm.scrollTop = cm.scrollHeight;
        });
      }
      function removeThinking() {
        var el = document.querySelector('.msg-thinking');
        if (el) el.parentNode.removeChild(el);
      }
      function showClosedMsg() {
        if (document.querySelector('.topic-closed-msg')) return;
        document
          .getElementById('chatMessages')
          .appendChild(mkEl('div', 'topic-closed-msg', t().closedTopic));
      }
      function renderChatFull() {
        var cm = document.getElementById('chatMessages');
        clearChildren(cm);
        var msgs = convos[activeTopic] || [];
        for (var i = 0; i < msgs.length; i++)
          cm.appendChild(buildMessage(msgs[i]));
        var isClosed = closedTopics.has(activeTopic);
        document.getElementById('chatInputBar').style.display = isClosed
          ? 'none'
          : 'flex';
        if (isClosed) showClosedMsg();
        if (!isClosed) {
          document.getElementById('chatInput').placeholder =
            t().chatPlaceholder;
          document.getElementById('sendBtn').disabled =
            loading || !document.getElementById('chatInput').value.trim();
        }
        requestAnimationFrame(function () {
          cm.scrollTop = cm.scrollHeight;
        });
      }
      function updateChatInputState() {
        var isClosed = closedTopics.has(activeTopic);
        document.getElementById('chatInputBar').style.display = isClosed
          ? 'none'
          : 'flex';
        if (!isClosed) {
          document.getElementById('chatInput').placeholder =
            t().chatPlaceholder;
          document.getElementById('sendBtn').disabled =
            loading || !document.getElementById('chatInput').value.trim();
        }
      }
      function renderTopics() {
        var tv = document.getElementById('topicsView');
        clearChildren(tv);
        episodesData[lang].forEach(function (ep) {
          var isOpen = openEpisodes.has(ep.id);
          var section = mkEl('div');
          section.style.marginBottom = '1rem';
          var toggle = mkBtn('ep-toggle', '', function () {
            toggleEp(ep.id);
          });
          toggle.appendChild(
            mkEl('span', 'ep-arrow' + (isOpen ? ' open' : ''), '▶'),
          );
          toggle.appendChild(document.createTextNode(ep.label));
          section.appendChild(toggle);
          if (isOpen) {
            var topicsDiv = mkEl('div', 'ep-topics');
            ep.topics.forEach(function (tp) {
              var isClosed = closedTopics.has(tp.id);
              var hasConvo = convos[tp.id] && convos[tp.id].length > 0;
              var btn = mkBtn(
                'topic-btn' + (isClosed ? ' closed' : ''),
                '',
                function () {
                  openTopic(tp.id);
                },
              );
              if (isClosed) btn.appendChild(mkEl('span', 'check', t().closed));
              var labelSpan = mkEl('span', null, tp.label);
              labelSpan.style.flex = '1';
              btn.appendChild(labelSpan);
              if (hasConvo && !isClosed)
                btn.appendChild(mkEl('span', 'cont', t().continuing));
              topicsDiv.appendChild(btn);
            });
            section.appendChild(topicsDiv);
          }
          tv.appendChild(section);
        });
        var freeSection = mkEl('div', 'free-section');
        freeSection.appendChild(mkEl('div', 'free-label', t().free));
        var freeInput = mkEl('input', 'free-input');
        freeInput.placeholder = t().freePlaceholder;
        freeInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && this.value.trim()) {
            startFree(this.value);
            this.value = '';
          }
        });
        freeSection.appendChild(freeInput);
        tv.appendChild(freeSection);
      }
      function showView(v) {
        view = v;
        document.getElementById('topicsView').style.display =
          v === 'topics' ? '' : 'none';
        document.getElementById('chatView').style.display =
          v === 'chat' ? 'flex' : 'none';
      }
      function handleParsed(parsed, topicId, aiId) {
        rez = Math.min(parsed.rez || rez, 0.95);
        var time = ts();
        entries.push({
          type: 'rez',
          rez: rez,
          reason: parsed.rez_reason || '',
          time: time,
          msgId: aiId,
          topicId: topicId,
        });
        if (parsed.surprise)
          entries.push({
            type: 'surprise',
            text: parsed.surprise,
            time: time,
            msgId: aiId,
            topicId: topicId,
          });
        if (parsed.topic_closed) closedTopics.add(topicId);
        updateRez();
        updateTimeline();
        if (parsed.topic_closed) {
          document.getElementById('chatInputBar').style.display = 'none';
          showClosedMsg();
        }
      }
      function toggleLang() {
        lang = lang === 'pl' ? 'en' : 'pl';
        updateHeader();
        updateRez();
        renderedTimelineCount = 0;
        updateTimeline();
        if (view === 'topics') renderTopics();
        else updateChatInputState();
        saveState();
      }
      function toggleEp(id) {
        openEpisodes.has(id) ? openEpisodes.delete(id) : openEpisodes.add(id);
        renderTopics();
      }
      function goBack() {
        activeTopic = null;
        showView('topics');
        renderTopics();
      }
      function openRezPanel() {
        document.getElementById('rezOverlay').classList.add('open');
      }
      function closeRezPanel() {
        document.getElementById('rezOverlay').classList.remove('open');
      }
      function findTopic(topicId) {
        for (var i = 0; i < episodesData[lang].length; i++) {
          var ep = episodesData[lang][i];
          for (var j = 0; j < ep.topics.length; j++) {
            if (ep.topics[j].id === topicId) return ep.topics[j];
          }
        }
        return null;
      }
      async function openTopic(topicId) {
        activeTopic = topicId;
        showView('chat');
        renderChatFull();
        if (convos[topicId] && convos[topicId].length) return;
        var tp = findTopic(topicId);
        if (!tp) return;
        loading = true;
        showThinking();
        updateChatInputState();
        try {
          var prompt =
            lang === 'pl'
              ? 'Tematyka rozmowy: "' +
                tp.opener +
                '". Zacznij rozmowę — przywitaj się krótko i zadaj pierwsze pytanie widzowi.'
              : 'Conversation topic: "' +
                tp.opener +
                '". Start the conversation — greet briefly and ask the viewer your first question.';
          var raw = await callAPI([{ role: 'user', content: prompt }]);
          var parsed = parseAI(raw);
          var aId = Date.now();
          convos[topicId] = [
            { role: 'assistant', text: parsed.response, raw: raw, id: aId },
          ];
          removeThinking();
          appendMessage(convos[topicId][0]);
          handleParsed(parsed, topicId, aId);
        } catch (e) {
          removeThinking();
          var fallback = {
            role: 'assistant',
            text: 'Cześć! Opowiedz mi...',
            id: Date.now(),
          };
          convos[topicId] = [fallback];
          appendMessage(fallback);
        }
        loading = false;
        updateChatInputState();
        saveState();
      }
      async function startFree(text) {
        var freeId = 'free_' + Date.now();
        activeTopic = freeId;
        showView('chat');
        renderChatFull();
        loading = true;
        var uMsg = { role: 'user', text: text, id: Date.now() };
        convos[freeId] = [uMsg];
        appendMessage(uMsg);
        showThinking();
        updateChatInputState();
        try {
          var raw = await callAPI([{ role: 'user', content: text }]);
          var parsed = parseAI(raw);
          var aId = Date.now() + 1;
          var aMsg = {
            role: 'assistant',
            text: parsed.response,
            raw: raw,
            id: aId,
          };
          convos[freeId].push(aMsg);
          removeThinking();
          appendMessage(aMsg);
          handleParsed(parsed, freeId, aId);
        } catch (e) {
          removeThinking();
          var fallback = {
            role: 'assistant',
            text: 'Błąd...',
            id: Date.now() + 1,
          };
          convos[freeId].push(fallback);
          appendMessage(fallback);
        }
        loading = false;
        updateChatInputState();
        saveState();
      }
      async function doSend() {
        var ta = document.getElementById('chatInput'),
          text = ta.value.trim();
        if (!text || !activeTopic) return;
        var uId = Date.now();
        if (!convos[activeTopic]) convos[activeTopic] = [];
        var uMsg = { role: 'user', text: text, id: uId };
        convos[activeTopic].push(uMsg);
        appendMessage(uMsg);
        ta.value = '';
        ta.style.height = 'auto';
        loading = true;
        showThinking();
        updateChatInputState();
        try {
          var history = convos[activeTopic].map(function (m) {
            return {
              role: m.role === 'user' ? 'user' : 'assistant',
              content: m.role === 'user' ? m.text : m.raw || m.text,
            };
          });
          var raw = await callAPI(history);
          var parsed = parseAI(raw);
          var aId = Date.now();
          var aMsg = {
            role: 'assistant',
            text: parsed.response,
            raw: raw,
            id: aId,
          };
          convos[activeTopic].push(aMsg);
          removeThinking();
          appendMessage(aMsg);
          handleParsed(parsed, activeTopic, aId);
        } catch (e) {
          removeThinking();
          var fallback = {
            role: 'assistant',
            text: 'Błąd połączenia.',
            id: Date.now(),
          };
          convos[activeTopic].push(fallback);
          appendMessage(fallback);
        }
        loading = false;
        updateChatInputState();
        saveState();
      }
      function scrollToMsg(msgId, topicId) {
        closeRezPanel();
        if (topicId && topicId !== activeTopic) {
          activeTopic = topicId;
          showView('chat');
          renderChatFull();
        }
        setTimeout(function () {
          var el = document.getElementById('msg-' + msgId);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 200);
      }
      document
        .getElementById('chatInput')
        .addEventListener('input', function () {
          this.style.height = 'auto';
          this.style.height = Math.min(this.scrollHeight, 120) + 'px';
          document.getElementById('sendBtn').disabled =
            loading || !this.value.trim();
        });
      document
        .getElementById('chatInput')
        .addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && !e.shiftKey && !loading) {
            e.preventDefault();
            doSend();
          }
        });
      function saveState() {
        try {
          localStorage.setItem('zs_convos', JSON.stringify(convos));
          localStorage.setItem('zs_entries', JSON.stringify(entries));
          localStorage.setItem('zs_rez', JSON.stringify(rez));
          localStorage.setItem(
            'zs_closed',
            JSON.stringify(Array.from(closedTopics)),
          );
          localStorage.setItem('zs_lang', lang);
        } catch (e) {}
      }
      function loadState() {
        try {
          var c = localStorage.getItem('zs_convos');
          if (c) convos = JSON.parse(c);
          var e = localStorage.getItem('zs_entries');
          if (e) entries = JSON.parse(e);
          var r = localStorage.getItem('zs_rez');
          if (r) rez = JSON.parse(r);
          var cl = localStorage.getItem('zs_closed');
          if (cl) closedTopics = new Set(JSON.parse(cl));
          var l = localStorage.getItem('zs_lang');
          if (l) lang = l;
        } catch (e) {}
      }
      async function init() {
        loadState();
        try {
          var results = await Promise.all([
            fetch('episodes.json'),
            fetch('../tesseract.txt'),
          ]);
          episodesData = await results[0].json();
          tesseractBase = await results[1].text();
        } catch (e) {
          console.error('Failed to load config:', e);
        }
        updateHeader();
        updateRez();
        renderedTimelineCount = 0;
        updateTimeline();
        renderTopics();
      }
      init();
    </script>
  </body>
</html>
