    <!-- Favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤝</text></svg>"
    />
    <link
      rel="apple-touch-icon"
      href="https://homodigital.io/apple-touch-icon.png"
    />

    <!-- Theme color (Android Chrome / Safari) -->
    <meta name="theme-color" content="#0a0a0a" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,300;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap');

      :root {
        --bg: #fafaf8;
        --text: #1a1a1a;
        --text-primary: #fff;
        --text-secondary: #555;
        --accent: #c0392b;
        --border: #e0ddd8;
        --code-bg: #1e1e2e;
        --block-bg: #f4f3ef;
        --max-w: 720px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Source Serif 4', Georgia, serif;
        font-size: 18px;
        line-height: 1.75;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      #content {
        max-width: var(--max-w);
        margin: 0 auto;
        padding: 3rem 1.5rem 6rem;
        opacity: 0;
        transform: translateY(12px);
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
      }

      #content.loaded {
        opacity: 1;
        transform: translateY(0);
      }

      /* Headings */
      #content h1 {
        font-size: 2.4rem;
        font-weight: 700;
        line-height: 1.2;
        margin: 2rem 0 1rem;
        letter-spacing: -0.02em;
        color: var(--text);
      }

      #content h1:first-child {
        margin-top: 0;
      }

      #content h2 {
        font-size: 1.6rem;
        font-weight: 600;
        line-height: 1.3;
        margin: 2.5rem 0 0.75rem;
        padding-bottom: 0.3rem;
        border-bottom: 1px solid var(--border);
        letter-spacing: -0.01em;
      }

      #content h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 2rem 0 0.5rem;
      }

      #content h4,
      #content h5,
      #content h6 {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 1.5rem 0 0.5rem;
        color: var(--text-secondary);
      }

      /* Paragraphs & inline */
      #content p {
        margin: 0 0 1.25rem;
      }

      #content strong {
        font-weight: 600;
      }

      #content a {
        color: var(--accent);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 2px;
        transition: color 0.15s;
      }

      #content a:hover {
        color: #922b21;
      }

      /* Lists */
      #content ul,
      #content ol {
        margin: 0 0 1.25rem 1.5rem;
      }

      #content li {
        margin-bottom: 0.35rem;
      }

      #content li > ul,
      #content li > ol {
        margin-top: 0.35rem;
        margin-bottom: 0;
      }

      /* Blockquotes */
      #content blockquote {
        margin: 1.5rem 0;
        padding: 0.75rem 1.25rem;
        border-left: 3px solid var(--accent);
        background: var(--block-bg);
        color: var(--text-secondary);
        font-style: italic;
        border-radius: 0 4px 4px 0;
      }

      #content blockquote p:last-child {
        margin-bottom: 0;
      }

      /* Code */
      #content code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85em;
        color: var(--text-secondary);
        background: var(--block-bg);
        padding: 0.15em 0.4em;
        border-radius: 3px;
        border: 1px solid var(--border);
      }

      #content pre {
        margin: 1.5rem 0;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #2a2a3a;
      }

      #content pre code {
        display: block;
        padding: 1.25rem 1.5rem;
        color: var(--text-primary);
        background: var(--code-bg);
        border: none;
        font-size: 0.85rem;
        line-height: 1.6;
        overflow-x: auto;
      }

      /* Tables */
      #content table {
        width: 100%;
        margin: 1.5rem 0;
        border-collapse: collapse;
        font-size: 0.92rem;
      }

      #content th {
        text-align: left;
        font-weight: 600;
        padding: 0.6rem 1rem;
        border-bottom: 2px solid var(--text);
        background: var(--block-bg);
      }

      #content td {
        padding: 0.55rem 1rem;
        border-bottom: 1px solid var(--border);
      }

      #content tr:hover td {
        background: var(--block-bg);
      }

      /* Horizontal rule */
      #content hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 2.5rem 0;
      }

      /* Images */
      #content img {
        max-width: 100%;
        height: auto;
        border-radius: 6px;
        margin: 1.5rem 0;
      }

      /* Error state */
      .error {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--text-secondary);
      }

      .error h2 {
        border: none;
        font-size: 1.3rem;
        color: var(--accent);
      }

      .error code {
        font-size: 0.9rem;
      }

      /* Loading */
      .loading {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--text-secondary);
        font-style: italic;
      }

      /* Print */
      @media print {
        @page {
          margin: 2cm 1.5cm;
        }
        body {
          background: white;
          font-size: 11pt;
          line-height: 1.5;
        }
        #content {
          max-width: 100%;
          padding: 1cm 1.5cm;
          margin: 0;
        }
        #content h1 {
          font-size: 18pt;
        }
        #content h2 {
          font-size: 14pt;
        }
        #content h3 {
          font-size: 12pt;
        }
        #content pre {
          border: 1px solid #ccc;
        }
        #content pre code {
          background: #f8f8f8;
          color: #333;
          font-size: 9pt;
        }
        #content blockquote {
          border-left-color: #999;
          background: #f8f8f8;
        }
        #content table {
          font-size: 10pt;
        }
      }

      /* Mobile */
      @media (max-width: 600px) {
        body {
          font-size: 16px;
        }
        #content {
          padding: 2rem 1rem 4rem;
        }
        #content h1 {
          font-size: 1.8rem;
        }
        #content h2 {
          font-size: 1.35rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="content">
      <div class="loading">Loading…</div>
    </div>

    <script>
      marked.setOptions({
        highlight: function (code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
          }
          return hljs.highlightAuto(code).value;
        },
        gfm: true,
        breaks: true,
      });

      const params = new URLSearchParams(window.location.search);
      const file = params.get('file');
      const el = document.getElementById('content');

      if (!file) {
        el.innerHTML =
          '<div class="error"><h2>No file specified</h2><p>Use <code>?file=./path/to/file.md</code></p></div>';
        el.classList.add('loaded');
      } else {
        fetch(file)
          .then(r => {
            if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
            return r.text();
          })
          .then(md => {
            el.innerHTML = marked.parse(md);
            // Update page title from first h1
            const h1 = el.querySelector('h1');
            if (h1) document.title = h1.textContent;
            el.classList.add('loaded');
          })
          .catch(err => {
            el.innerHTML =
              '<div class="error"><h2>Cannot load file</h2><p><code>' +
              file +
              '</code></p><p>' +
              err.message +
              '</p></div>';
            el.classList.add('loaded');
          });
      }
    </script>
  </body>
</html>
