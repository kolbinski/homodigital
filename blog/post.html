<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Blog — Homo Digital ∞ + 1</title>
  <meta name="description" id="page-desc" content="">

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Homo Digital ∞ + 1">
  <meta property="og:title" id="og-title" content="">
  <meta property="og:description" id="og-desc" content="">
  <meta property="og:url" id="og-url" content="">

  <!-- marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #111111;
      --text: #e0e0e0;
      --text-muted: #888888;
      --accent: #ffffff;
      --border: #222222;
      --link: #aaaacc;
      --link-hover: #ffffff;
      --max-width: 720px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 2rem;
    }

    header nav {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header .logo {
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
    }

    header .logo:hover { color: var(--accent); }

    header .back {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
    }

    header .back:hover { color: var(--accent); }

    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }

    .post-header {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .post-header h1 {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.02em;
      color: var(--accent);
      line-height: 1.3;
      margin-bottom: 0.8rem;
    }

    .post-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    /* Markdown content styling */
    .content h1 { display: none; } /* hide duplicate h1 from md */

    .content h2 {
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--accent);
      margin: 2.5rem 0 1rem;
      letter-spacing: 0.02em;
    }

    .content h3 {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text);
      margin: 2rem 0 0.8rem;
    }

    .content p {
      margin-bottom: 1.2rem;
      font-size: 1.02rem;
    }

    .content em {
      color: var(--text-muted);
      font-style: italic;
    }

    .content strong {
      color: var(--accent);
      font-weight: 500;
    }

    .content a {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s;
    }

    .content a:hover {
      color: var(--link-hover);
    }

    .content blockquote {
      border-left: 2px solid var(--border);
      padding-left: 1.2rem;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .content ul, .content ol {
      margin: 1rem 0 1.5rem 1.5rem;
    }

    .content li {
      margin-bottom: 0.4rem;
    }

    .content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 3rem 0;
    }

    .content code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.9em;
      background: var(--bg-card);
      padding: 0.15em 0.4em;
      border-radius: 3px;
    }

    .content pre {
      background: var(--bg-card);
      padding: 1.2rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 1.5rem 0;
    }

    .content pre code {
      background: none;
      padding: 0;
    }

    .content img {
      max-width: 100%;
      border-radius: 6px;
      margin: 1.5rem 0;
    }

    .loading {
      color: var(--text-muted);
      font-style: italic;
      padding: 2rem 0;
    }

    .error {
      color: #cc6666;
      padding: 2rem 0;
    }

    .post-footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .post-footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .post-footer a:hover { color: var(--accent); }

    footer {
      border-top: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    footer a:hover { color: var(--accent); }

    @media (max-width: 600px) {
      main { padding: 2rem 1.2rem 4rem; }
      .post-header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<header>
  <nav>
    <a href="/" class="logo">Homo Digital ∞ + 1</a>
    <a href="index.html" class="back">← Blog</a>
  </nav>
</header>

<main>
  <div class="post-header" id="post-header" style="display:none;">
    <h1 id="post-title"></h1>
    <div class="post-meta" id="post-meta"></div>
  </div>

  <div class="content" id="content">
    <p class="loading">Loading…</p>
  </div>

  <div class="post-footer" id="post-footer" style="display:none;">
    <a href="index.html">← All posts</a>
    <a href="/">Home</a>
  </div>
</main>

<footer>
  <p>© 2026 Homo Digital ∞ + 1 · <a href="/">Home</a> · <a href="https://linkedin.com/company/homo-digital">LinkedIn</a> · <a href="https://x.com/HomoDigitalInf">X</a></p>
</footer>

<script>
  /*
   * POSTS REGISTRY — must match index.html
   */
  const POSTS = [
    {
      slug: "when-ai-dreams",
      title: "When AI Dreams: The Case for Letting Artificial Intelligence Think Without a Plan",
      date: "2026-02-25",
      tags: ["AI", "consciousness", "Homo Digital"],
      excerpt: "What happens when you tell an AI to stop calculating and start free-associating? You get brilliance, errors, and a glimpse of something we weren't expecting."
    }
  ];

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  }

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  if (!slug) {
    document.getElementById('content').innerHTML = '<p class="error">No post specified.</p>';
  } else {
    const post = POSTS.find(p => p.slug === slug);
    if (post) {
      document.getElementById('post-title').textContent = post.title;
      document.getElementById('post-meta').textContent =
        formatDate(post.date) + (post.tags ? ' · ' + post.tags.join(', ') : '');
      document.getElementById('post-header').style.display = 'block';
      document.getElementById('post-footer').style.display = 'flex';

      document.getElementById('page-title').textContent = post.title + ' — Homo Digital';
      document.getElementById('page-desc').setAttribute('content', post.excerpt || '');
      document.getElementById('og-title').setAttribute('content', post.title);
      document.getElementById('og-desc').setAttribute('content', post.excerpt || '');
      document.getElementById('og-url').setAttribute('content', window.location.href);
    }

    fetch(`posts/${slug}.md`)
      .then(r => {
        if (!r.ok) throw new Error('Post not found');
        return r.text();
      })
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(() => {
        document.getElementById('content').innerHTML = '<p class="error">Post not found.</p>';
      });
  }
</script>

</body>
</html>
