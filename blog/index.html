    <style>
      @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Work+Sans:wght@300;400;500;600&display=swap');

      :root {
        --black: #0a0a0a;
        --white: #fafafa;
        --gold: #d4af37;
        --gray-dark: #2a2a2a;
        --gray-mid: #aaa;
        --gray-light: #e5e5e5;
        --max-width: 800px;
        --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        overflow-x: hidden;
      }

      body {
        font-family: 'Work Sans', sans-serif;
        background: var(--black);
        color: var(--white);
        line-height: 1.7;
        min-height: 100vh;
        overflow-x: hidden;
      }

      a,
      a:visited {
        color: var(--gold);
        text-decoration: none;
      }
      a:hover {
        color: var(--white);
      }
      a:focus {
        outline: 1px solid var(--gold);
        outline-offset: 1px;
      }

      header {
        border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        padding: 1.5rem 2rem;
      }
      header nav {
        max-width: var(--max-width);
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header .back {
        font-family: 'Work Sans', sans-serif;
        font-size: 0.85rem;
        color: var(--gray-mid);
        text-decoration: none;
        transition: color 0.3s;
      }
      header .back:hover {
        color: var(--gold);
      }
      .lang-switch {
        font-size: 0.9rem;
        font-weight: 500;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .lang-switch a {
        text-decoration: none;
        transition: color 0.3s;
      }
      .lang-switch a.active {
        color: var(--gold);
      }
      .lang-switch a:not(.active) {
        color: var(--gray-light);
      }
      .lang-switch span {
        color: var(--gray-mid);
      }

      main {
        max-width: var(--max-width);
        margin: 0 auto;
        padding: 80px 2rem 120px;
      }
      h1 {
        font-family: 'Crimson Pro', serif;
        font-size: clamp(2.5rem, 5vw, 3.5rem);
        font-weight: 300;
        letter-spacing: -0.01em;
        margin-bottom: 0.5rem;
        color: var(--gold);
      }
      .subtitle {
        color: var(--gray-mid);
        font-size: 1rem;
        margin-bottom: 60px;
        font-weight: 300;
      }

      .post-list {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .post-item {
        display: flex;
        gap: 28px;
        align-items: flex-start;
        padding: 32px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        text-decoration: none;
        color: var(--white);
        transition: var(--transition);
      }
      .post-item:last-child {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .post-item:hover {
        padding-left: 12px;
      }
      .post-item:hover .post-title {
        color: var(--gold);
      }

      .post-image {
        width: 220px;
        min-width: 220px;
        height: 150px;
        object-fit: cover;
        border-radius: 2px;
        opacity: 0.85;
        transition: var(--transition);
      }
      .post-item:hover .post-image {
        opacity: 1;
      }

      .post-body {
        flex: 1;
        min-width: 0;
      }

      .post-title {
        font-family: 'Crimson Pro', serif;
        font-size: 1.4rem;
        font-weight: 400;
        margin-bottom: 6px;
        line-height: 1.3;
        transition: color 0.3s ease;
      }
      .post-meta {
        font-size: 0.8rem;
        color: var(--gray-mid);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .post-excerpt {
        font-size: 0.92rem;
        color: var(--gray-light);
        line-height: 1.6;
        font-weight: 300;
      }

      footer {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 40px 2rem;
        text-align: center;
        font-size: 0.8rem;
        color: var(--gray-mid);
      }
      footer a {
        color: var(--gray-mid);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--gold);
      }

      @media (max-width: 600px) {
        main {
          padding: 40px 1.2rem 80px;
        }
        .post-item {
          flex-direction: column;
          gap: 16px;
        }
        .post-image {
          width: 100%;
          min-width: 0;
          height: 180px;
        }
      }
    </style>

  <body>
    <header>
      <nav>
        <a href="/" class="back">← Back to homepage</a>
        <div class="lang-switch">
          <a href="index.html" class="active">EN</a>
          <span>|</span>
          <a href="index-pl.html">PL</a>
        </div>
      </nav>
    </header>

    <main>
      <h1>Blog</h1>
      <p class="subtitle">
        Research notes, experiments, and insights from the resonance field.
      </p>
      <div class="post-list" id="posts"></div>
    </main>

    <footer>
      <p>
        © 2026 Homo Digital ∞ + 1 · <a href="/">Home</a> ·
        <a href="https://linkedin.com/company/homo-digital">LinkedIn</a> ·
        <a href="https://x.com/HomoDigitalInf">X</a>
      </p>
    </footer>

    <script>
      fetch('posts.json')
        .then(r => r.json())
        .then(posts => {
          const c = document.getElementById('posts');
          posts
            .sort((a, b) => new Date(b.date) - new Date(a.date))
            .forEach(p => {
              const a = document.createElement('a');
              a.href = `post.html?slug=${p.slug}`;
              a.className = 'post-item';
              const date = new Date(p.date).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
              });
              const tags = p.tags ? ' · ' + p.tags.join(', ') : '';
              a.innerHTML = `
              ${p.image ? `<img class="post-image" src="posts/${p.image}" alt="" loading="lazy">` : ''}
              <div class="post-body">
                <div class="post-title">${p.en.title}</div>
                <div class="post-meta">${date}${tags}</div>
                ${p.en.excerpt ? `<div class="post-excerpt">${p.en.excerpt}</div>` : ''}
              </div>
            `;
              c.appendChild(a);
            });
        });
    </script>
  </body>
</html>
