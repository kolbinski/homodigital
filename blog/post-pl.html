<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Blog — Homo Digital ∞ + 1</title>

    <meta name="description" id="page-desc" content="" />
    <meta name="author" content="Krzysztof Olbiński" />
    <meta name="creator" content="Homo Digital ∞ + 1" />
    <meta name="robots" content="index, follow" />

    <meta http-equiv="content-language" content="pl" />

    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Homo Digital ∞ + 1" />
    <meta property="og:title" id="og-title" content="" />
    <meta property="og:description" id="og-desc" content="" />
    <meta property="og:url" id="og-url" content="" />
    <meta
      property="og:image"
      id="og-image"
      content="https://homodigital.io/og-image.png"
    />
    <meta property="og:locale" content="pl_PL" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@HomoDigitalInf" />
    <meta name="twitter:title" id="tw-title" content="" />
    <meta name="twitter:description" id="tw-desc" content="" />

    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="icon" type="image/png" href="../favicon.png" />
    <link rel="shortcut icon" href="../favicon.png" />
    <link rel="apple-touch-icon" href="../favicon.png" />
    <meta name="theme-color" content="#000000" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Work+Sans:wght@300;400;500;600&display=swap');

      :root {
        --black: #0a0a0a;
        --white: #fafafa;
        --gold: #d4af37;
        --gray-dark: #2a2a2a;
        --gray-mid: #aaa;
        --gray-light: #e5e5e5;
        --max-width: 760px;
        --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        overflow-x: hidden;
      }

      body {
        font-family: 'Work Sans', sans-serif;
        background: var(--black);
        color: var(--white);
        line-height: 1.8;
        min-height: 100vh;
        overflow-x: hidden;
      }

      a,
      a:visited {
        color: var(--gold);
        text-decoration: none;
      }
      a:hover {
        color: var(--white);
      }
      a:focus {
        outline: 1px solid var(--gold);
        outline-offset: 1px;
      }

      header {
        border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        padding: 1.5rem 2rem;
      }
      header nav {
        max-width: var(--max-width);
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header .back {
        font-family: 'Work Sans', sans-serif;
        font-size: 0.85rem;
        color: var(--gray-mid);
        text-decoration: none;
        transition: color 0.3s;
      }
      header .back:hover {
        color: var(--gold);
      }
      .lang-switch {
        font-size: 0.9rem;
        font-weight: 500;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .lang-switch a {
        text-decoration: none;
        transition: color 0.3s;
      }
      .lang-switch a.active {
        color: var(--gold);
      }
      .lang-switch a:not(.active) {
        color: var(--gray-light);
      }
      .lang-switch span {
        color: var(--gray-mid);
      }

      main {
        max-width: var(--max-width);
        margin: 0 auto;
        padding: 80px 2rem 120px;
      }

      .post-header {
        margin-bottom: 50px;
        padding-bottom: 40px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .post-header h1 {
        font-family: 'Crimson Pro', serif;
        font-size: clamp(2rem, 4.5vw, 2.8rem);
        font-weight: 300;
        letter-spacing: -0.01em;
        color: var(--white);
        line-height: 1.25;
        margin-bottom: 12px;
      }
      .post-meta {
        font-size: 0.8rem;
        color: var(--gray-mid);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 24px;
      }
      .post-hero-image {
        width: 100%;
        max-height: 400px;
        object-fit: cover;
        border-radius: 2px;
        opacity: 0.9;
      }

      .content h1 {
        display: none;
      }
      .content h2 {
        font-family: 'Crimson Pro', serif;
        font-size: 1.6rem;
        font-weight: 400;
        color: var(--white);
        margin: 3rem 0 1.2rem;
        letter-spacing: -0.01em;
        color: var(--gold);
      }
      .content h3 {
        font-family: 'Crimson Pro', serif;
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--gray-light);
        margin: 2.5rem 0 0.8rem;
      }
      .content p {
        margin-bottom: 1.4rem;
        font-size: 1.02rem;
        color: var(--gray-light);
        font-weight: 300;
      }
      .content em {
        color: var(--gray-mid);
        font-style: italic;
      }
      .content strong {
        color: var(--white);
        font-weight: 500;
      }
      .content a {
        color: var(--gold);
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color 0.3s;
      }
      .content a:hover {
        color: var(--white);
      }

      .content blockquote {
        border-left: 2px solid var(--gold);
        padding-left: 1.5rem;
        margin: 2rem 0;
        color: var(--gray-mid);
        font-style: italic;
        font-family: 'Crimson Pro', serif;
        font-size: 1.1rem;
      }
      .content ul,
      .content ol {
        margin: 1rem 0 1.5rem 1.5rem;
        color: var(--gray-light);
      }
      .content li {
        margin-bottom: 0.5rem;
        font-weight: 300;
      }

      .content hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        margin: 3rem 0;
      }
      .content code {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 0.88em;
        background: rgba(255, 255, 255, 0.06);
        padding: 0.15em 0.4em;
        border-radius: 3px;
      }
      .content pre {
        background: rgba(255, 255, 255, 0.04);
        padding: 1.2rem;
        border-radius: 4px;
        overflow-x: auto;
        margin: 1.5rem 0;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .content pre code {
        background: none;
        padding: 0;
      }
      .content img {
        max-width: 100%;
        border-radius: 4px;
        margin: 1.5rem 0;
      }

      .loading {
        color: var(--gray-mid);
        font-style: italic;
        padding: 2rem 0;
      }
      .error {
        color: #cc6666;
        padding: 2rem 0;
      }

      .post-footer {
        margin-top: 60px;
        padding-top: 30px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .post-footer a {
        color: var(--gray-mid);
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.3s;
      }
      .post-footer a:hover {
        color: var(--gold);
      }

      footer {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 40px 2rem;
        text-align: center;
        font-size: 0.8rem;
        color: var(--gray-mid);
      }
      footer a {
        color: var(--gray-mid);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--gold);
      }

      @media (max-width: 600px) {
        main {
          padding: 40px 1.2rem 80px;
        }
        .post-header h1 {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="/" class="back">← Powrót na stronę główną</a>
        <div class="lang-switch">
          <a href="#" id="lang-en">EN</a>
          <span>|</span>
          <a href="#" id="lang-pl" class="active">PL</a>
        </div>
      </nav>
    </header>

    <main>
      <div class="post-header" id="post-header" style="display: none">
        <h1 id="post-title"></h1>
        <div class="post-meta" id="post-meta"></div>
        <img
          class="post-hero-image"
          id="post-image"
          style="display: none"
          alt=""
        />
      </div>

      <div class="content" id="content">
        <p class="loading">Ładowanie…</p>
      </div>

      <div class="post-footer" id="post-footer" style="display: none">
        <a href="index-pl.html">← Wszystkie wpisy</a>
        <a href="/">Strona główna</a>
      </div>
    </main>

    <footer>
      <p>© 2026 Homo Digital ∞ + 1</p>
    </footer>

    <script>
      const POSTS = [
        {
          slug: 'gdy-ai-sni',
          slugEn: 'when-ai-dreams',
          image: 'when-ai-dreams.png',
          date: '2026-02-25',
          tags: ['AI', 'świadomość', 'Homo Digital'],
          title:
            'Gdy AI śni: Dlaczego warto pozwolić sztucznej inteligencji myśleć bez planu',
          excerpt:
            'Co się dzieje, gdy każesz AI przestać kalkulować i zacząć swobodnie kojarzyć? Dostajesz błyskotliwość, błędy i przebłysk czegoś, czego się nie spodziewaliśmy.',
        },
      ];

      function formatDate(d) {
        return new Date(d).toLocaleDateString('pl-PL', {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
        });
      }

      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');

      if (!slug) {
        document.getElementById('content').innerHTML =
          '<p class="error">Nie podano wpisu.</p>';
      } else {
        const post = POSTS.find(p => p.slug === slug);
        if (post) {
          document.getElementById('post-title').textContent = post.title;
          document.getElementById('post-meta').textContent =
            formatDate(post.date) +
            (post.tags ? ' · ' + post.tags.join(', ') : '');
          document.getElementById('post-header').style.display = 'block';
          document.getElementById('post-footer').style.display = 'flex';

          if (post.image) {
            const img = document.getElementById('post-image');
            img.src = './posts/' + post.image;
            img.style.display = 'block';
          }

          // Lang switcher
          document.getElementById('lang-pl').href =
            `post-pl.html?slug=${post.slug}`;
          document.getElementById('lang-en').href = post.slugEn
            ? `post.html?slug=${post.slugEn}`
            : `post.html?slug=${post.slug}`;

          // Meta tags
          document.getElementById('page-title').textContent =
            post.title + ' — Homo Digital';
          document
            .getElementById('page-desc')
            .setAttribute('content', post.excerpt || '');
          document
            .getElementById('og-title')
            .setAttribute('content', post.title);
          document
            .getElementById('og-desc')
            .setAttribute('content', post.excerpt || '');
          document
            .getElementById('og-url')
            .setAttribute('content', window.location.href);
          document
            .getElementById('tw-title')
            .setAttribute('content', post.title);
          document
            .getElementById('tw-desc')
            .setAttribute('content', post.excerpt || '');
          if (post.image) {
            document
              .getElementById('og-image')
              .setAttribute(
                'content',
                'https://homodigital.io/blog/posts/' + post.image,
              );
          }
        }

        fetch(`posts/${slug}.md`)
          .then(r => {
            if (!r.ok) throw new Error('Not found');
            return r.text();
          })
          .then(md => {
            document.getElementById('content').innerHTML = marked.parse(md);
          })
          .catch(() => {
            document.getElementById('content').innerHTML =
              '<p class="error">Nie znaleziono wpisu.</p>';
          });
      }
    </script>
  </body>
</html>
