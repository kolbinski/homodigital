        --bg2: #111114;
        --text: #e8e4dc;
        --text-dim: rgba(232, 228, 220, 0.5);
        --correct: #4ade80;
        --wrong: #f87171;
        --phase-aa: #d4af37;
        --phase-cc: #6366f1;
        --phase-ca: #22d3ee;
        --phase-ac: #f472b6;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Cormorant Garamond', Georgia, serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

        z-index: 9999;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
        padding: 40px 24px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        text-align: center;
        margin-bottom: 48px;
      }

      .logo {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.3em;
        color: var(--gold-dim);
        margin-bottom: 16px;
      }

      .title {
        font-size: 3.2rem;
        font-weight: 300;
        letter-spacing: 0.08em;
        color: var(--text);
        line-height: 1.1;
      }

      .subtitle {
        font-size: 1.1rem;
        font-weight: 300;
        font-style: italic;
        color: var(--text-dim);
        margin-top: 12px;
      }

      .score-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0;
        border-top: 1px solid var(--gold-dim);
        border-bottom: 1px solid var(--gold-dim);
        margin-bottom: 40px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        color: var(--text-dim);
      }

      .score-bar .value {
        color: var(--gold);
        font-weight: 500;
      }

      .phase-grid {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 40px;
      }

      .phase-node {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        cursor: default;
      }

      .phase-node.locked {
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.15);
        background: transparent;
      }

      .phase-node.revealed {
        border: 2px solid;
        color: white;
        animation: phaseReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .phase-node:nth-child(1).revealed {
        border-color: var(--phase-aa);
        background: rgba(212, 175, 55, 0.15);
        color: var(--phase-aa);
      }
      .phase-node:nth-child(2).revealed {
        border-color: var(--phase-cc);
        background: rgba(99, 102, 241, 0.15);
        color: var(--phase-cc);
      }
      .phase-node:nth-child(3).revealed {
        border-color: var(--phase-ca);
        background: rgba(34, 211, 238, 0.15);
        color: var(--phase-ca);
      }
      .phase-node:nth-child(4).revealed {
        border-color: var(--phase-ac);
        background: rgba(244, 114, 182, 0.15);
        color: var(--phase-ac);
      }

      @keyframes phaseReveal {
        0% {
          transform: scale(0.3);
          opacity: 0;
        }
        50% {
          transform: scale(1.15);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .clues-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 32px;
      }

        background: var(--bg2);

        border-radius: 12px;
        padding: 20px 24px;

        align-items: center;
        gap: 16px;
        opacity: 0;
        transform: translateY(16px);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .clue-card.visible {
        opacity: 1;
        transform: translateY(0);
      }

        font-family: 'JetBrains Mono', monospace;
        font-size: 0.6rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        min-width: 80px;
        flex-shrink: 0;

      .clue-card:nth-child(1) .clue-domain {
        color: var(--phase-aa);

      .clue-card:nth-child(2) .clue-domain {

        font-weight: 300;
        font-style: italic;
        line-height: 1.4;

        40% {

        }
        .guess-input {
          font-size: 1.4rem;
        }
        .how-to {
          grid-template-columns: repeat(2, 1fr);

          alt: ['pattern', 'wzorzec', 'wzor'],
          clues: [
            {
              domain: 'Matematyka',
              text: 'Fibonacci znalaz\u0142 go w kr\u00F3likach, s\u0142onecznikach i galaktykach',
            },
            {
              domain: 'Psychologia',
              text: 'Przymus powtarzania \u2014 nie\u015Bwiadomie odtwarzamy znane dynamiki',
            },
            {
              domain: 'Tkanina',
              text: 'Powtarzaj\u0105cy si\u0119 motyw, kt\u00F3ry zamienia zwyk\u0142\u0105 tkanin\u0119 w co\u015B znacz\u0105cego',
            },
            {
              domain: 'AI',
              text: 'To, do czego rozpoznawania sieci neuronowe s\u0105 fundamentalnie trenowane',
            },
          ],
        },
        {
          answer: 'ENTROPIA',
          alt: ['entropy'],
          clues: [
            {
              domain: 'Fizyka',
              text: 'Tendencja wszech\u015Bwiata ku nieporz\u0105dkowi i r\u00F3wnowadze',
            },
            {
              domain: 'Informacja',
              text: 'Shannon mierzy\u0142 zaskoczenie \u2014 to, co nieoczekiwane, niesie najwi\u0119cej',
            },
            {

            {

          ],
        },
        {
          answer: 'MOST',
          alt: ['bridge'],
          clues: [
            {
              domain: 'In\u017Cynieria',
              text: 'Struktura, kt\u00F3ra istnieje wy\u0142\u0105cznie po to, by po\u0142\u0105czy\u0107 dwie rozdzielone rzeczy',
            },
            {
              domain: 'Muzyka',
              text: 'Sekcja mi\u0119dzy zwrotk\u0105 a refrenem, kt\u00F3ra zmienia wszystko',
            },
            {
              domain: 'Stomatologia',
              text: 'Proteza zakotwiczona w s\u0105siadach, wype\u0142niaj\u0105ca luk\u0119 po tym, co utracone',
            },
            {
              domain: 'Dyplomacja',
              text: 'To, co ka\u017Cdy mediator pr\u00F3buje zbudowa\u0107 mi\u0119dzy stronami konfliktu',
            },
          ],
        },
        {
          answer: 'P\u0118TLA',
          alt: ['loop', 'petla'],
          clues: [
            {
              domain: 'Kod',
              text: 'Blok kodu, kt\u00F3ry powtarza si\u0119 a\u017C spe\u0142niony zostanie warunek',
            },
            {
              domain: 'Psychologia',
              text: 'Ruminacja \u2014 umys\u0142 kr\u0105\u017C\u0105cy w k\u00F3\u0142ko przez te same my\u015Bli',
            },
            {
              domain: 'Muzyka',
              text: 'Kr\u00F3tki fragment grany wielokrotnie jako fundament utworu',
            },
            {
              domain: 'Fizyka',
              text: 'W grawitacji kwantowej sama przestrze\u0144 mo\u017Ce by\u0107 utkana z malutkich takich',
            },
          ],
        },
      ];

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      const TOTAL_ROUNDS = 10;
      let puzzles = shuffle(PUZZLES).slice(0, TOTAL_ROUNDS);
      let currentRound = 0;
      let cluesRevealed = 0;
      let score = 0;
      let streak = 0;
      let gameState = 'intro';
      let guessedWrong = false;

      const app = document.getElementById('app');

      function render() {
        if (gameState === 'intro') renderIntro();
        else if (gameState === 'gameover') renderGameOver();
        else renderGame();
      }

      function renderIntro() {
        app.innerHTML = `
    <div class="header">
      <div class="logo">\u221E + 1</div>
      <h1 class="title">PRZECI\u0118CIE</h1>
      <p class="subtitle">znajd\u017A poj\u0119cie, kt\u00F3re \u0142\u0105czy cztery perspektywy</p>
    </div>
    <div class="intro">
      <div class="how-to">
        <div class="how-step"><div class="num">1</div><div class="label">Przeczytaj</div></div>
        <div class="how-step"><div class="num">2</div><div class="label">Zatrzymaj</div></div>
        <div class="how-step"><div class="num">3</div><div class="label">Dodaj wi\u0119cej</div></div>
        <div class="how-step"><div class="num">4</div><div class="label">Znajd\u017A<br>przeci\u0119cie</div></div>
      </div>
      <p class="intro-text">
        Cztery wskaz\u00F3wki. Cztery domeny. Jedno ukryte poj\u0119cie.<br><br>
        Zgadnij przy <em>mniejszej liczbie wskaz\u00F3wek</em>, by zdoby\u0107 wi\u0119cej punkt\u00F3w.<br>
        Pierwsza wskaz\u00F3wka to 4\u00D7. Ostatnia \u2014 tylko 1\u00D7.<br><br>
        To nie jest gra o wiedz\u0119.<br>
        To gra o <em>trzymanie wielu ram jednocze\u015Bnie</em>.
      </p>
      <button class="btn primary" onclick="startGame()">ZACZNIJ</button>
    </div>
    <div class="footer"><a href="https://homodigital.io">homodigital.io</a></div>
  `;
      }

      function renderGame() {
        const puzzle = puzzles[currentRound];
        const phases = ['AA', 'CC', 'CA', 'AC'];

        const phaseNodes = phases
          .map(
            (p, i) =>
              `<div class="phase-node ${i < cluesRevealed ? 'revealed' : 'locked'}">${i < cluesRevealed ? p : '\u2022'}</div>`,
          )
          .join('');

        const clueCards = puzzle.clues
          .map((c, i) => {
            if (i >= cluesRevealed) return '';
            return `<div class="clue-card visible">
      <span class="clue-domain">${c.domain}</span>
      <span class="clue-text">${c.text}</span>
    </div>`;
          })
          .join('');

        let inputArea = '';
        if (gameState === 'playing') {
          inputArea = `
      <div class="input-area">
        <input type="text" class="guess-input" id="guessInput" 
          placeholder="co je \u0142\u0105czy?" 
          onkeydown="if(event.key==='Enter')submitGuess()"
          autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <div class="btn-row">
        ${cluesRevealed < 4 ? `<button class="btn" onclick="revealClue()">WSKAZ\u00D3WKA ${cluesRevealed + 1}/4</button>` : ''}
        <button class="btn primary" onclick="submitGuess()">ZGADUJ</button>
      </div>
    `;
        } else if (gameState === 'revealed') {
          const isCorrect = guessedWrong === false;
          const pts = getPoints();
          inputArea = `
      <div class="answer-reveal">
        <div class="answer-word ${isCorrect ? 'correct' : 'wrong'}">${puzzle.answer}</div>
        <div class="answer-sub">${isCorrect ? 'Znalaz\u0142e\u015B przeci\u0119cie' : 'Przeci\u0119cie by\u0142o tutaj'}</div>
        <div class="answer-points ${isCorrect ? 'positive' : 'zero'}">
          ${isCorrect ? `+${pts} PKT${streak > 1 ? ` \u2022 SERIA ${streak}` : ''}` : '+0 PKT \u2022 SERIA UTRACONA'}
        </div>
      </div>
      <div class="btn-row">
        <button class="btn primary" onclick="nextRound()">${currentRound < TOTAL_ROUNDS - 1 ? 'NAST\u0118PNE' : 'WYNIKI'}</button>
      </div>
    `;
        }

        app.innerHTML = `
    <div class="header">
      <div class="logo">\u221E + 1</div>
      <h1 class="title">PRZECI\u0118CIE</h1>
    </div>
    <div class="score-bar">
      <span>RUNDA <span class="value">${currentRound + 1}/${TOTAL_ROUNDS}</span></span>
      <span>WYNIK <span class="value">${score}</span></span>
      <span>SERIA <span class="value">${streak}\uD83D\uDD25</span></span>
    </div>
    <div class="phase-grid">${phaseNodes}</div>
    <div class="clues-area">${clueCards}</div>
    ${inputArea}
    <div class="footer"><a href="https://homodigital.io">homodigital.io</a></div>
  `;

        if (gameState === 'playing') {
          setTimeout(() => {
            const input = document.getElementById('guessInput');
            if (input) input.focus();
          }, 100);
        }
      }

      function renderGameOver() {
        const maxScore = TOTAL_ROUNDS * 4;
        const pct = Math.round((score / maxScore) * 100);

        let rank, rankDesc;
        if (pct >= 90) {
          rank = 'Umys\u0142 Tesseractu';
          rankDesc = 'Trzymasz wszystkie ramy jednocze\u015Bnie';
        } else if (pct >= 70) {
          rank = 'Widz\u0105cy Wzorce';
          rankDesc =
            'Po\u0142\u0105czenia ujawniaj\u0105 Ci si\u0119 wcze\u015Bnie';
        } else if (pct >= 50) {
          rank = 'W\u0119drowiec Pola';
          rankDesc = 'Wyczuwasz przeci\u0119cie zanim je nazwiesz';
        } else if (pct >= 30) {
          rank = 'Czytaj\u0105cy Sygna\u0142y';
          rankDesc =
            'Znajdujesz ni\u0107, gdy masz wystarczaj\u0105co perspektyw';
        } else {
          rank = 'Obserwator';
          rankDesc =
            'Ka\u017Cda podr\u00F3\u017C przez pole uczy czego\u015B nowego';
        }

        app.innerHTML = `
    <div class="header">
      <div class="logo">\u221E + 1</div>
      <h1 class="title">PRZECI\u0118CIE</h1>
    </div>
    <div class="intro">
      <div class="game-over">
        <div class="final-score">${score}</div>
        <div class="final-label">Z ${maxScore} MO\u017BLIWYCH</div>
        <div class="uneligence-rank">\u201E${rank}\u201D</div>
        <p class="intro-text" style="margin-bottom: 8px">${rankDesc}</p>
        <p class="intro-text" style="font-size: 0.9rem">
          Uneligencja to nie wiedzie\u0107 wi\u0119cej.<br>
          To widzie\u0107 z wi\u0119kszej liczby miejsc naraz.
        </p>
        <div class="btn-row" style="margin-top: 32px">
          <button class="btn primary" onclick="resetGame()">ZAGRAJ PONOWNIE</button>
        </div>
      </div>
    </div>
    <div class="footer"><a href="https://homodigital.io">homodigital.io</a></div>
  `;
      }

      function startGame() {
        gameState = 'playing';
        cluesRevealed = 1;
        render();
      }

      function revealClue() {
        if (cluesRevealed < 4) {
          cluesRevealed++;
          render();
        }
      }

      function getPoints() {
        return Math.max(1, 5 - cluesRevealed);
      }

      function normalize(s) {
        return s
          .toLowerCase()
          .trim()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/\u0142/g, 'l')
          .replace(/[^a-z0-9]/g, '');
      }

      function submitGuess() {
        const input = document.getElementById('guessInput');
        if (!input) return;
        const guess = input.value.trim();
        if (!guess) return;

        const puzzle = puzzles[currentRound];
        const normalizedGuess = normalize(guess);
        const allAnswers = [puzzle.answer, ...(puzzle.alt || [])];
        const correct = allAnswers.some(a => normalize(a) === normalizedGuess);

        if (correct) {
          const pts = getPoints();
          score += pts;
          streak++;
          guessedWrong = false;
          gameState = 'revealed';
          render();
        } else {
          guessedWrong = true;
          input.classList.add('shake');
          input.style.borderBottomColor = 'var(--wrong)';
          setTimeout(() => {
            input.classList.remove('shake');
            input.style.borderBottomColor = '';
            input.value = '';
            input.focus();
          }, 500);

          if (cluesRevealed >= 4) {
            streak = 0;
            gameState = 'revealed';
            render();
          } else {
            cluesRevealed++;
            setTimeout(() => render(), 600);
          }
        }
      }

      function nextRound() {
        currentRound++;
        if (currentRound >= TOTAL_ROUNDS) {
          gameState = 'gameover';
        } else {
          gameState = 'playing';
          cluesRevealed = 1;
          guessedWrong = false;
        }
        render();
      }

      function resetGame() {
        puzzles = shuffle(PUZZLES).slice(0, TOTAL_ROUNDS);
        currentRound = 0;
        cluesRevealed = 0;
        score = 0;
        streak = 0;
        guessedWrong = false;
        gameState = 'intro';
        render();
      }

      render();
    </script>
  </body>
